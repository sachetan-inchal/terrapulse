dth=\"1.5\"><title>Epoch 22: 0.482</title></circle><circle cx=\"500.0\" cy=\"93.1\" r=\"3.5\" fill=\"#f59e0b\" stroke=\"#0f172a\" stroke-width=\"1.5\"><title>Epoch 25: 0.601</title></circle>\n      <rect x=\"50\" y=\"12\" width=\"12\" height=\"4\" rx=\"2\" fill=\"#a855f7\" /><text x=\"66\" y=\"17\" font-size=\"11\" fill=\"#e2e8f0\" font-weight=\"600\">Train F1</text><rect x=\"150\" y=\"12\" width=\"12\" height=\"4\" rx=\"2\" fill=\"#ec4899\" /><text x=\"166\" y=\"17\" font-size=\"11\" fill=\"#e2e8f0\" font-weight=\"600\">Test F1 (Best: 0.799)</text><rect x=\"354\" y=\"12\" width=\"12\" height=\"4\" rx=\"2\" fill=\"#f59e0b\" /><text x=\"370\" y=\"17\" font-size=\"11\" fill=\"#e2e8f0\" font-weight=\"600\">Test IoU (0.665)</text>\n    </svg>\n    \n                  <div style=\"font-size:0.8rem; color:#94a3b8; margin-top:8px;\">\n                    Peak test metrics: <strong>F1 = 0.799, IoU = 0.665 at epoch 15</strong>. Massive improvement over pixel-diff baseline.\n                  </div>\n                </div>\n              </div>\n            </div>\n            <div class=\"card\" style=\"margin-top:12px; background:rgba(30,41,59,0.5);\">\n              <div style=\"display:flex; justify-content:space-around; text-align:center;\">\n                <div><span style=\"color:#94a3b8; font-size:0.8rem;\">Classical Pixel-Diff Baseline</span><br><strong style=\"font-size:1.1rem; color:#ef4444;\">F1: 0.164 | IoU: 0.089</strong></div>\n                <div><span style=\"color:#94a3b8; font-size:0.8rem;\">Siamese U-Net (Ours)</span><br><strong style=\"font-size:1.1rem; color:#10b981;\">F1: 0.799 | IoU: 0.665</strong></div>\n                <div><span style=\"color:#94a3b8; font-size:0.8rem;\">Relative F1 Gain</span><br><strong style=\"font-size:1.1rem; color:#38bdf8;\">+387.2% Improvement</strong></div>\n              </div>\n            </div>\n            ", "notes": "These exact numbers come from the CSV training logs in the checkpoints/ folder, committed to the repository. Best checkpoint is epoch 10 (classifier) and epoch 15 (change detector)."}, {"id": 8, "title": "Geospatial CV & Autonomous OSINT", "subtitle": "Modular Python Library: terrapulse Package Architecture", "category": "Software Engineering", "branch": "branch: feature/geospatial-cv-osint", "content": "\n            <div class=\"grid-4\">\n              <div class=\"card feature-card\">\n                <div class=\"feature-icon\" style=\"background:#065f46; color:#34d399;\">\ud83c\udf31</div>\n                <h4 style=\"color:#34d399; margin:6px 0;\">1. multispectral.py</h4>\n                <p style=\"font-size:0.82rem; color:#cbd5e1; line-height:1.4;\">Computes NDVI, NDWI, NDBI, SAVI, BSI, EVI with <strong>\u03b5 = 1\u00d710\u207b\u2075</strong> stability. Integrates Sentinel-2 Scene Classification Layer (SCL) cloud/shadow masking and quality scoring (0\u2013100).</p>\n              </div>\n              <div class=\"card feature-card\">\n                <div class=\"feature-icon\" style=\"background:#1e3a8a; color:#60a5fa;\">\ud83d\udcd0</div>\n                <h4 style=\"color:#60a5fa; margin:6px 0;\">2. change_detection.py</h4>\n                <p style=\"font-size:0.82rem; color:#cbd5e1; line-height:1.4;\">Euclidean spectral delta: <code>\u0394I = \u2016I(t\u2082) \u2212 I(t\u2081)\u2016\u2082</code> with Otsu adaptive thresholding and <strong>5\u00d75 Land-Cover Transition Matrix</strong> quantifying deforestation, urban sprawl, and water loss in hectares.</p>\n              </div>\n              <div class=\"card feature-card\">\n                <div class=\"feature-icon\" style=\"background:#701a75; color:#f472b6;\">\ud83d\udee1\ufe0f</div>\n                <h4 style=\"color:#f472b6; margin:6px 0;\">3. osint_engine.py</h4>\n                <p style=\"font-size:0.82rem; color:#cbd5e1; line-height:1.4;\">Computes <strong>Ecological Vulnerability Index (EVI)</strong>: <code>0.40\u00b7Defor + 0.35\u00b7Urban + 0.25\u00b7Water - Regen</code>. Maps threat levels (CRITICAL to REGENERATIVE) with regional context DBs and Markdown/JSON export.</p>\n              </div>\n              <div class=\"card feature-card\">\n                <div class=\"feature-icon\" style=\"background:#78350f; color:#fbbf24;\">\ud83e\udde9</div>\n                <h4 style=\"color:#fbbf24; margin:6px 0;\">4. robust_matcher.py</h4>\n                <p style=\"font-size:0.82rem; color:#cbd5e1; line-height:1.4;\">Illumination-invariant stitching using CLAHE contrast equalization, morphological gradient filtering, bi-directional FLANN matching, and affine-constrained RANSAC for nadir satellite views.</p>\n              </div>\n            </div>\n            <div class=\"card\" style=\"margin-top:14px; background:rgba(15,23,42,0.8);\">\n              <h4 style=\"color:#38bdf8; margin:0 0 8px 0; font-size:0.9rem;\">Command Line Interface (CLI) Demonstration</h4>\n              <div class=\"code-block\" style=\"font-size:0.85rem;\">\n                python -m terrapulse multispectral --red B04.tif --nir B08.tif --indices ndvi ndwi --output-dir outputs/<br>\n                python -m terrapulse osint --region \"Bengaluru\" --deforestation 18.4 --urban 42.1 --format markdown\n              </div>\n            </div>\n            ", "notes": "This branch introduced a fully independent Python library with a CLI, not just notebook scripts. The test suite (tests/test_terrapulse.py) validates each module with exact numerical assertions."}, {"id": 9, "title": "Classical CV Algorithms Applied", "subtitle": "SIFT Keypoint Detection, FLANN KD-Tree Matching & RANSAC Homography", "category": "Computer Vision Theory", "branch": "extras & terrapulse", "content": "\n            <div class=\"two-col\">\n              <div class=\"card\">\n                <h4 style=\"color:#38bdf8; margin:0 0 10px 0;\">The 5-Stage Stitching Pipeline</h4>\n                <ol class=\"styled-list\" style=\"font-size:0.88rem;\">\n                  <li><strong>Scale-Space Extrema Detection:</strong> Difference-of-Gaussians (DoG) pyramid detects scale/rotation-invariant interest points.</li>\n                  <li><strong>128-D SIFT Descriptors:</strong> 8-bin gradient orientation histograms across 4\u00d74 spatial sub-regions.</li>\n                  <li><strong>FLANN Matching:</strong> Randomized KD-Trees (5 trees, 50 checks) for accelerated approximate nearest-neighbor query.</li>\n                  <li><strong>Lowe's Ratio Test:</strong> Rejects ambiguous matches where <code>d\u2081 \u2265 0.75 \u00b7 d\u2082</code>.</li>\n                  <li><strong>RANSAC Homography Estimation:</strong> Computes 3\u00d73 projective homography matrix <code>H</code> while rejecting geometric outliers.</li>\n                </ol>\n                <div class=\"alert-success\" style=\"margin-top:12px;\">\n                  <strong>Empirical Verification on Test Tiles:</strong><br>\n                  Synthetic tile stitch test achieved <strong>89.4% inlier ratio</strong> with reprojection error threshold &lt; 5.0 pixels.\n                </div>\n              </div>\n              <div class=\"card\" style=\"display:flex; flex-direction:column; justify-content:center;\">\n                <h4 style=\"color:#10b981; margin:0 0 10px 0;\">Perspective Warp & Feathering</h4>\n                <div style=\"background:#020617; padding:12px; border-radius:8px; border:1px solid rgba(255,255,255,0.1); font-family:monospace; font-size:0.8rem; line-height:1.6; color:#93c5fd;\">\n                  // Projective transformation equation<br>\n                  [x' y' 1]\u1d40 ~ H \u00b7 [x y 1]\u1d40<br><br>\n                  // RANSAC Optimization Target<br>\n                  arg min_H \u03a3 \u03c1( || p'_i - H\u00b7p_i ||\u00b2 )<br><br>\n                  // Overlap Zone Linear Feathering<br>\n                  I_mosaic(x, y) = \u03b1(x) \u00b7 I\u2081(x, y) + (1 - \u03b1(x)) \u00b7 I\u2082(x, y)\n                </div>\n                <div style=\"margin-top:12px; display:flex; gap:8px;\">\n                  <img src=\"tile_left.jpg\" style=\"width:48%; height:90px; object-fit:cover; border-radius:6px; border:1px solid #334155;\" alt=\"Tile Left\" onerror=\"this.style.display='none';\">\n                  <img src=\"tile_right.jpg\" style=\"width:48%; height:90px; object-fit:cover; border-radius:6px; border:1px solid #334155;\" alt=\"Tile Right\" onerror=\"this.style.display='none';\">\n                </div>\n                <div style=\"font-size:0.75rem; color:#94a3b8; text-align:center; margin-top:4px;\">Figure: Input overlapping satellite tiles (tile_left.jpg, tile_right.jpg)</div>\n              </div>\n            </div>\n            ", "notes": "Walk the teacher through the SIFT pipeline step by step. RANSAC is a key concept \u2014 it's a statistical outlier-rejection estimator, not simple thresholding."}, {"id": 10, "title": "Unified Platform & Live STAC Engine", "subtitle": "5-Tab Streamlit Web Application Connecting Directly to Orbit", "category": "Integrated Application", "branch": "branch: main", "content": "\n            <div class=\"table-container\" style=\"margin-bottom:14px;\">\n              <table class=\"styled-table\">\n                <thead>\n                  <tr>\n                    <th>Tab Identifier</th>\n                    <th>Functional Purpose</th>\n                    <th>Backing Technologies</th>\n                    <th>Input / Output</th>\n                  </tr>\n                </thead>\n                <tbody>\n                  <tr>\n                    <td><strong>\ud83d\udef0\ufe0f EarthWatch</strong></td>\n                    <td>Live Sentinel-2 temporal analysis & classification</td>\n                    <td>Nominatim, STAC API, PyTorch ResNet-18</td>\n                    <td>Any city name \u2192 2 temporal tiles + change overlay</td>\n                  </tr>\n                  <tr>\n                    <td><strong>\ud83c\udf10 STAC Mosaicker</strong></td>\n                    <td>Global 2\u00d72 tile mosaic synthesis</td>\n                    <td>pystac-client, rasterio COG, UTM reproject</td>\n                    <td>Lat/Lon coords \u2192 4 Cloud-Optimized GeoTIFFs</td>\n                  </tr>\n                  <tr>\n                    <td><strong>\ud83d\udd2c Model Studio</strong></td>\n                    <td>Interactive architecture visualizer</td>\n                    <td>U-Net, DeepLabV3+ ASPP, Prithvi-EO ViT</td>\n                    <td>Synthetic input \u2192 Feature activation heatmaps</td>\n                  </tr>\n                  <tr>\n                    <td><strong>\ud83d\udcd0 SIFT & RANSAC</strong></td>\n                    <td>Interactive photogrammetric stitching</td>\n                    <td>OpenCV SIFT, FLANN, warpPerspective</td>\n                    <td>Upload 2 tiles \u2192 Feature matches & fused scene</td>\n                  </tr>\n                  <tr>\n                    <td><strong>\ud83d\udd2e Future Simulator</strong></td>\n                    <td>Spatiotemporal projection concept</td>\n                    <td>Streamlit timeline scrubber (1985\u20132050)</td>\n                    <td>Year slider \u2192 Projected urban footprint preview</td>\n                  </tr>\n                </tbody>\n              </table>\n            </div>\n            <div class=\"card\" style=\"background:rgba(15,23,42,0.7);\">\n              <h4 style=\"color:#10b981; margin:0 0 6px 0; font-size:0.9rem;\">Live Cloud Streaming Without Storage Overhead</h4>\n              <p style=\"font-size:0.85rem; color:#cbd5e1; margin:0; line-height:1.4;\">\n                Nominatim geocodes location to WGS-84 bbox \u2794 STAC catalogue retrieves up to 4 cloud-free scenes \u2794 <code>rasterio</code> streams overview bands B04, B03, B02 directly over HTTP with window decimation \u2794 Tiles reprojected to common UTM coordinate reference system on-the-fly.\n              </p>\n            </div>\n            ", "notes": "The 'Live Sentinel-2' mode connects to Planetary Computer in real time \u2014 no download required, no paid key. This is genuine satellite imagery, not placeholder data."}, {"id": 11, "title": "Comprehensive Technology Stack", "subtitle": "Open-Source Scientific Computing & Remote Sensing Ecosystem", "category": "Tech Stack", "branch": "All Branches", "content": "\n            <div class=\"grid-3\">\n              <div class=\"card\">\n                <h4 style=\"color:#38bdf8; margin:0 0 10px 0;\">\ud83e\udde0 Machine Learning & DL</h4>\n                <ul class=\"styled-list\" style=\"font-size:0.85rem;\">\n                  <li><strong>PyTorch 2.4.1</strong> \u2014 Pinned for MPS/CUDA tensor acceleration</li>\n                  <li><strong>torchvision 0.19.1</strong> \u2014 ResNet-18 pretrained backbone</li>\n                  <li><strong>segmentation-models-pytorch</strong> \u2014 U-Net & DeepLabV3+ architectures</li>\n                  <li><strong>timm & transformers</strong> \u2014 NASA Prithvi-EO-1.0 foundation model support</li>\n                </ul>\n              </div>\n              <div class=\"card\">\n                <h4 style=\"color:#10b981; margin:0 0 10px 0;\">\ud83d\udef0\ufe0f Geospatial & CV Core</h4>\n                <ul class=\"styled-list\" style=\"font-size:0.85rem;\">\n                  <li><strong>OpenCV 4.10</strong> \u2014 SIFT keypoints, FLANN matcher, warpPerspective</li>\n                  <li><strong>rasterio 1.3</strong> \u2014 Cloud-Optimized GeoTIFF streaming & UTM warping</li>\n                  <li><strong>pystac-client & planetary-computer</strong> \u2014 SpatioTemporal Asset Catalog queries</li>\n                  <li><strong>NumPy 1.26.4 & SciPy</strong> \u2014 Vectorized array operations and filters</li>\n                </ul>\n              </div>\n              <div class=\"card\">\n                <h4 style=\"color:#ec4899; margin:0 0 10px 0;\">\ud83d\udcbb UI, Testing & Ops</h4>\n                <ul class=\"styled-list\" style=\"font-size:0.85rem;\">\n                  <li><strong>Streamlit 1.38.0</strong> \u2014 Multi-tab reactive UI dashboard (app.py)</li>\n                  <li><strong>Gradio</strong> \u2014 Model studio interactive exploration</li>\n                  <li><strong>pytest 8.3.3 & unittest</strong> \u2014 Automated regression tests & CI suite</li>\n                  <li><strong>OpenStreetMap Nominatim</strong> \u2014 Free bounding-box geocoding</li>\n                </ul>\n              </div>\n            </div>\n            <div class=\"card\" style=\"margin-top:14px; background:rgba(30,41,59,0.5); display:flex; justify-content:space-between; align-items:center;\">\n              <div><strong>System Reproducibility:</strong> All versions pinned in <code>requirements.txt</code> with zero paid API keys.</div>\n              <span class=\"badge badge-emerald\">CPU & MPS Friendly</span>\n            </div>\n            ", "notes": "The core pipeline is entirely CPU/MPS runnable \u2014 no cloud GPU account needed. requirements.txt is pinned to exact versions for full reproducibility."}, {"id": 12, "title": "Empirical Benchmark Scorecard", "subtitle": "Rigorous Evaluation: Target vs Achieved Performance Metrics", "category": "Evaluation", "branch": "All Branches", "content": "\n            <div class=\"table-container\">\n              <table class=\"styled-table\">\n                <thead>\n                  <tr>\n                    <th>Subsystem</th>\n                    <th>Evaluation Dataset</th>\n                    <th>Metric</th>\n                    <th>Engineering Target</th>\n                    <th>Achieved Result</th>\n                    <th>Status</th>\n                  </tr>\n                </thead>\n                <tbody>\n                  <tr>\n                    <td><strong>Land-Cover Classifier</strong></td>\n                    <td>EuroSAT (27,000 tiles, 10 classes)</td>\n                    <td>Top-1 Validation Accuracy</td>\n                    <td>\u2265 85.0%</td>\n                    <td><strong style=\"color:#34d399;\">96.35%</strong> (Epoch 10)</td>\n                    <td><span class=\"badge badge-emerald\">\u2705 +11.35% Margin</span></td>\n                  </tr>\n                  <tr>\n                    <td><strong>Pixel Baseline</strong></td>\n                    <td>LEVIR-CD (Unsupervised Diff)</td>\n                    <td>Test F1 Score / IoU</td>\n                    <td>Baseline Reference</td>\n                    <td>F1 = 0.164, IoU = 0.089</td>\n                    <td><span class=\"badge badge-sky\">Benchmark Base</span></td>\n                  </tr>\n                  <tr>\n                    <td><strong>Siamese U-Net</strong></td>\n                    <td>LEVIR-CD (832 train / 192 test)</td>\n                    <td>Test F1 Score</td>\n                    <td>\u2265 0.700</td>\n                    <td><strong style=\"color:#34d399;\">0.799</strong> (Epoch 15)</td>\n                    <td><span class=\"badge badge-emerald\">\u2705 +14.1% Margin</span></td>\n                  </tr>\n                  <tr>\n                    <td><strong>Siamese U-Net</strong></td>\n                    <td>LEVIR-CD (832 train / 192 test)</td>\n                    <td>Intersection over Union (IoU)</td>\n                    <td>\u2265 0.500</td>\n                    <td><strong style=\"color:#34d399;\">0.665</strong> (Epoch 15)</td>\n                    <td><span class=\"badge badge-emerald\">\u2705 +33.0% Margin</span></td>\n                  </tr>\n                  <tr>\n                    <td><strong>Classical Tile Stitcher</strong></td>\n                    <td>Overlapping Synthetic Satellite Tiles</td>\n                    <td>RANSAC Inlier Ratio</td>\n                    <td>\u2265 25.0%</td>\n                    <td><strong style=\"color:#34d399;\">89.4%</strong></td>\n                    <td><span class=\"badge badge-emerald\">\u2705 Robust Homography</span></td>\n                  </tr>\n                  <tr>\n                    <td><strong>Live STAC Streaming</strong></td>\n                    <td>Planetary Computer Global Queries</td>\n                    <td>On-the-fly Mosaicking</td>\n                    <td>Operational</td>\n                    <td><strong style=\"color:#34d399;\">100% cloud-free</strong> (Swiss Alps)</td>\n                    <td><span class=\"badge badge-emerald\">\u2705 Operational</span></td>\n                  </tr>\n                </tbody>\n              </table>\n            </div>\n            <div style=\"font-size:0.8rem; color:#94a3b8; margin-top:8px; text-align:right;\">\n              *All numerical metrics pulled directly from <code>checkpoints/*.csv</code> and <code>PROGRESS.md</code>.\n            </div>\n            ", "notes": "The Siamese U-Net F1 of 0.799 represents a ~387% improvement over the pixel-difference baseline (0.164). Published SOTA models on the full LEVIR-CD 7,120-tile training set score higher \u2014 we used only 832 tiles, a deliberate scope constraint."}, {"id": 13, "title": "Qualitative System Demonstrations", "subtitle": "Live Tested Scenarios Across Real-World Geographic Regions", "category": "Demonstrations", "branch": "main & terrapulse", "content": "\n            <div class=\"two-col\">\n              <div class=\"card\">\n                <h4 style=\"color:#38bdf8; margin:0 0 10px 0;\">Geographic Preset Verifications</h4>\n                <div class=\"metric-card\">\n                  <div class=\"metric-title\">Swiss Alps Mosaicking</div>\n                  <div class=\"metric-desc\">Successfully retrieved 4 cloud-free Sentinel-2 tiles across alpine terrain; fused into a seamless 2\u00d72 mosaic with zero visual seam line.</div>\n                </div>\n                <div class=\"metric-card\">\n                  <div class=\"metric-title\">Bengaluru Urban Transition</div>\n                  <div class=\"metric-desc\">Demonstrated 42.1 ha urban sprawl vs 18.4 ha canopy loss over 5-year baseline, triggering HIGH threat alert.</div>\n                </div>\n                <div class=\"metric-card\">\n                  <div class=\"metric-title\">Nile Delta & Grand Canyon</div>\n                  <div class=\"metric-desc\">Validated extreme spectral contrast: high NDWI water vs bare soil / agricultural transitions.</div>\n                </div>\n              </div>\n              <div class=\"card\">\n                <h4 style=\"color:#f472b6; margin:0 0 10px 0;\">Sample Autonomous OSINT Dossier</h4>\n                <div style=\"background:#090d16; padding:12px; border-radius:8px; border:1px solid rgba(255,255,255,0.1); font-family:monospace; font-size:0.75rem; line-height:1.45; color:#cbd5e1;\">\n                  <strong style=\"color:#38bdf8;\"># TERRA-OSINT INTELLIGENCE DOSSIER</strong><br>\n                  Region: Bengaluru | Timestamp: 2026-10-16<br>\n                  ----------------------------------------<br>\n                  \u2022 Baseline Land-Cover : Moderate Vegetation (68%)<br>\n                  \u2022 Detected Disturbance: 60.5 Hectares<br>\n                  \u2022 Deforestation Index : 18.4 ha (-12.2% canopy)<br>\n                  \u2022 Urban Encroachment  : 42.1 ha (+28.4% impervious)<br>\n                  ----------------------------------------<br>\n                  <strong style=\"color:#f59e0b;\">ECOLOGICAL VULNERABILITY SCORE (EVI): 58.3 / 100</strong><br>\n                  <strong style=\"color:#ef4444;\">THREAT ASSESSMENT LEVEL: HIGH</strong><br>\n                  Tactical Action: Immediate wetland buffer zoning review recommended.\n                </div>\n              </div>\n            </div>\n            ", "notes": "All of these results are reproducible by running the app or CLI. No invented numbers anywhere in this section."}, {"id": 14, "title": "Engineering Concepts Applied", "subtitle": "Mapping Academic Theory to Practical Implementation", "category": "Academic Rigor", "branch": "Engineering Concepts", "content": "\n            <div class=\"two-col\">\n              <div class=\"card\">\n                <h4 style=\"color:#10b981; margin:0 0 10px 0;\">Deep Learning & Vision Concepts</h4>\n                <ul class=\"styled-list\" style=\"font-size:0.85rem;\">\n                  <li><strong>Transfer Learning:</strong> Inductive transfer from ImageNet weights to multi-spectral remote sensing domain.</li>\n                  <li><strong>Siamese Architectures:</strong> Exact parameter sharing eliminates asymmetry when computing temporal difference vectors.</li>\n                  <li><strong>Multi-Scale Feature Pyramids:</strong> Difference calculation at 4 encoder scales ensures both small structures and large parcels are detected.</li>\n                  <li><strong>RANSAC Model Fitting:</strong> Non-deterministic iterative estimation guaranteeing robust homography in the presence of repetitive textures.</li>\n                  <li><strong>Atrous Separable Convolutions:</strong> ASPP expands receptive fields without losing spatial resolution or exploding parameter counts.</li>\n                </ul>\n              </div>\n              <div class=\"card\">\n                <h4 style=\"color:#38bdf8; margin:0 0 10px 0;\">Geospatial & Numerical Concepts</h4>\n                <ul class=\"styled-list\" style=\"font-size:0.85rem;\">\n                  <li><strong>Radiometric Index Normalization:</strong> Ratio formulation cancelling topographic shading and solar angle variations.</li>\n                  <li><strong>Otsu\u2019s Bimodal Thresholding:</strong> Maximizes inter-class variance between background and disturbed pixels autonomously.</li>\n                  <li><strong>Stochastic Matrix Quantification:</strong> 5\u00d75 transition probability matrix converting pixel counts into legal metric hectares.</li>\n                  <li><strong>COG Window Streaming:</strong> HTTP range-request decimation avoiding multi-gigabyte satellite image downloads.</li>\n                  <li><strong>Cross-UTM Coordinate Warping:</strong> Dynamic reprojection across UTM boundaries via rasterio transform matrices.</li>\n                </ul>\n              </div>\n            </div>\n            ", "notes": "Each of these maps directly to a concept from the CCVR course and/or standard remote sensing / CV literature."}, {"id": 15, "title": "End-to-End Operational Workflow", "subtitle": "Systemic Ingestion, Preprocessing, Inference & Intelligence Synthesis", "category": "System Pipeline", "branch": "Full Pipeline", "content": "\n            <div class=\"pipeline-flow\">\n              <div class=\"pipe-step\">\n                <div class=\"pipe-header\">1. User Query</div>\n                <div class=\"pipe-body\">Location name / Coordinates entered via Streamlit UI or CLI</div>\n              </div>\n              <div class=\"pipe-arrow\">\u2794</div>\n              <div class=\"pipe-step\">\n                <div class=\"pipe-header\">2. Ingestion</div>\n                <div class=\"pipe-body\">Nominatim geocode \u2794 Planetary Computer STAC \u2794 COG Range Stream</div>\n              </div>\n              <div class=\"pipe-arrow\">\u2794</div>\n              <div class=\"pipe-step\">\n                <div class=\"pipe-header\">3. Preprocessing</div>\n                <div class=\"pipe-body\">SCL Cloud Mask \u00b7 Cross-UTM Reproject \u00b7 6 Radiometric Indices</div>\n              </div>\n              <div class=\"pipe-arrow\">\u2794</div>\n              <div class=\"pipe-step\">\n                <div class=\"pipe-header\">4. Perception Core</div>\n                <div class=\"pipe-body\">ResNet-18 Classifier \u00b7 Siamese U-Net Change \u00b7 SIFT Mosaic</div>\n              </div>\n              <div class=\"pipe-arrow\">\u2794</div>\n              <div class=\"pipe-step\">\n                <div class=\"pipe-header\">5. Intelligence</div>\n                <div class=\"pipe-body\">5\u00d75 Matrix \u00b7 EVI Scoring \u00b7 OSINT Dossier \u00b7 Interactive Visuals</div>\n              </div>\n            </div>\n            <div class=\"card\" style=\"margin-top:20px;\">\n              <h4 style=\"color:#a855f7; margin:0 0 10px 0;\">Pipeline Integration Characteristics</h4>\n              <div class=\"two-col\" style=\"font-size:0.85rem; line-height:1.5; color:#cbd5e1;\">\n                <div>\n                  \u2022 <strong>Decoupled Modularity:</strong> The <code>terrapulse</code> core package operates autonomously as a standalone CLI or importable library.<br>\n                  \u2022 <strong>Fault-Tolerant Fallback:</strong> If live satellite cloud queries fail or exceed timeouts, bundled offline LEVIR-CD pairs activate automatically.\n                </div>\n                <div>\n                  \u2022 <strong>Stateless Execution:</strong> Satellite scenes are processed in-memory as NumPy arrays, avoiding local disk bloat.<br>\n                  \u2022 <strong>Reproducible Validation:</strong> Every transformation step is validated by unit tests in <code>tests/test_terrapulse.py</code>.\n                </div>\n              </div>\n            </div>\n            ", "notes": "Point out how each stage feeds the next \u2014 STAC tiles feed both the classifier and the change detector. The OSINT engine consumes outputs from the change detector."}, {"id": 16, "title": "Honest Engineering Limitations", "subtitle": "Explicit Architectural Constraints and Scope Boundaries", "category": "Engineering Integrity", "branch": "Limitations", "content": "\n            <div class=\"table-container\">\n              <table class=\"styled-table\">\n                <thead>\n                  <tr>\n                    <th>Design Limitation</th>\n                    <th>Technical Rationale</th>\n                    <th>Current System State</th>\n                  </tr>\n                </thead>\n                <tbody>\n                  <tr>\n                    <td><strong>Subset LEVIR-CD Training</strong></td>\n                    <td>Full 7,120-tile dataset requires multi-day GPU cluster runs; out of local workstation scope.</td>\n                    <td>Trained rigorously on 832 training tiles; achieves 0.799 F1.</td>\n                  </tr>\n                  <tr>\n                    <td><strong>Temporal Forecasting (CNN-LSTM)</strong></td>\n                    <td>Requires dense multi-temporal historical imagery archives and 3D convolution compute.</td>\n                    <td>Not implemented; bi-temporal pairwise detection implemented.</td>\n                  </tr>\n                  <tr>\n                    <td><strong>SAR (Sentinel-1) Fusion</strong></td>\n                    <td>Radar speckle filtering and SAR-optical geometric coregistration requires specialized GIS stacks.</td>\n                    <td>Optical Sentinel-2 L2A utilized exclusively.</td>\n                  </tr>\n                  <tr>\n                    <td><strong>Google Earth Engine Backend</strong></td>\n                    <td>Requires mandatory user credential authentication; incompatible with unattended execution.</td>\n                    <td>Microsoft Planetary Computer STAC used (zero credentials required).</td>\n                  </tr>\n                  <tr>\n                    <td><strong>Model Studio Visualizations</strong></td>\n                    <td>Running live forward hooks on giant ViT models consumes heavy memory on consumer machines.</td>\n                    <td>Analytical mathematical feature maps (DoG, spatial gradients, patch variance).</td>\n                  </tr>\n                  <tr>\n                    <td><strong>Future Simulator</strong></td>\n                    <td>Generative world modeling (diffusion) is an active multi-billion parameter research problem.</td>\n                    <td>UI and architectural schema (EarthTilePackage) preview only.</td>\n                  </tr>\n                </tbody>\n              </table>\n            </div>\n            ", "notes": "Honesty on limitations is a strength in academic review. The project explicitly documented what was not done and why, in PROGRESS.md. This is professional engineering practice."}, {"id": 17, "title": "Future Scope & Research Roadmap", "subtitle": "Three Horizons of Strategic Development", "category": "Future Scope", "branch": "Roadmap", "content": "\n            <div class=\"grid-3\">\n              <div class=\"card horizon-card\">\n                <div class=\"horizon-badge\" style=\"background:#0284c7;\">Horizon 1: Short-Term</div>\n                <h4 style=\"color:#38bdf8; margin:10px 0 6px 0;\">Scale & Evaluation</h4>\n                <ul class=\"styled-list\" style=\"font-size:0.83rem;\">\n                  <li>Scale training to the <strong>full 7,120-tile LEVIR-CD</strong> corpus to target F1 \u2265 0.88.</li>\n                  <li>Implement per-class confusion matrix and ROC curves in the Streamlit UI.</li>\n                  <li>Add automated Sentinel-1 SAR speckle filter and day/night dual-mode inference.</li>\n                  <li>Multi-temporal (>3 timesteps) trajectory regression for urbanization rates.</li>\n                </ul>\n              </div>\n              <div class=\"card horizon-card\">\n                <div class=\"horizon-badge\" style=\"background:#7c3aed;\">Horizon 2: Medium-Term</div>\n                <h4 style=\"color:#a855f7; margin:10px 0 6px 0;\">Temporal Modeling</h4>\n                <ul class=\"styled-list\" style=\"font-size:0.83rem;\">\n                  <li>Train a <strong>ConvLSTM / VideoSwin</strong> architecture for spatiotemporal deforestation forecasting.</li>\n                  <li>Realize the <code>EarthTilePackage</code> multi-modal schema with temporal embedding layers.</li>\n                  <li>Deploy Google Earth Engine as an optional authenticated enterprise backend.</li>\n                  <li>Automated real-time alert dispatch via webhooks and email subscriptions.</li>\n                </ul>\n              </div>\n              <div class=\"card horizon-card\">\n                <div class=\"horizon-badge\" style=\"background:#db2777;\">Horizon 3: Long-Term</div>\n                <h4 style=\"color:#f472b6; margin:10px 0 6px 0;\">Generative World Models</h4>\n                <ul class=\"styled-list\" style=\"font-size:0.83rem;\">\n                  <li><strong>Conditional Latent Diffusion:</strong> Photorealistic satellite imagery simulation under climate warming scenarios.</li>\n                  <li>Interactive 3D WebGL digital twin globe with real-time change particle streams.</li>\n                  <li>Integration with commercial high-res constellations (Planet Labs 3m, Maxar 0.3m).</li>\n                </ul>\n              </div>\n            </div>\n            ", "notes": "The future scope directly maps to limitations. The Tier 3 architecture (EarthTilePackage dataclass) is already formally designed and visible in the codebase as a Python dataclass schema."}, {"id": 18, "title": "Academic & Literature References", "subtitle": "Authoritative Citations Grounding System Design", "category": "References", "branch": "Academic Foundations", "content": "\n            <div class=\"two-col\">\n              <div class=\"card\">\n                <h4 style=\"color:#38bdf8; margin:0 0 10px 0;\">Datasets & Deep Learning</h4>\n                <div class=\"ref-item\">\n                  <strong>[1] EuroSAT Benchmark:</strong> Helber, P. et al. (2019). <em>EuroSAT: A Novel Dataset and Deep Learning Benchmark for Land Use and Land Cover Classification.</em> IEEE JSTARS.\n                </div>\n                <div class=\"ref-item\">\n                  <strong>[2] LEVIR-CD:</strong> Chen, H. et al. (2020). <em>A Spatial-Temporal Attention-Based Method and a New Dataset for Remote Sensing Image Change Detection.</em> Remote Sensing.\n                </div>\n                <div class=\"ref-item\">\n                  <strong>[3] ResNet:</strong> He, K. et al. (2016). <em>Deep Residual Learning for Image Recognition.</em> IEEE CVPR.\n                </div>\n                <div class=\"ref-item\">\n                  <strong>[4] U-Net:</strong> Ronneberger, O. et al. (2015). <em>Convolutional Networks for Biomedical Image Segmentation.</em> MICCAI.\n                </div>\n                <div class=\"ref-item\">\n                  <strong>[5] DeepLabV3+:</strong> Chen, L.-C. et al. (2018). <em>Encoder-Decoder with Atrous Separable Convolution.</em> ECCV.\n                </div>\n              </div>\n              <div class=\"card\">\n                <h4 style=\"color:#10b981; margin:0 0 10px 0;\">Vision, Remote Sensing & Systems</h4>\n                <div class=\"ref-item\">\n                  <strong>[6] SIFT:</strong> Lowe, D. G. (2004). <em>Distinctive Image Features from Scale-Invariant Keypoints.</em> International Journal of Computer Vision (IJCV).\n                </div>\n                <div class=\"ref-item\">\n                  <strong>[7] RANSAC:</strong> Fischler, M. A. & Bolles, R. C. (1981). <em>Random Sample Consensus: A Paradigm for Model Fitting.</em> Communications of the ACM.\n                </div>\n                <div class=\"ref-item\">\n                  <strong>[8] NASA Prithvi-EO:</strong> Jakubik, J. et al. (2023). <em>Foundation Models for Generalist Geospatial Artificial Intelligence.</em> arXiv:2310.18660.\n                </div>\n                <div class=\"ref-item\">\n                  <strong>[9] ESA Sentinel-2:</strong> European Space Agency. <em>Sentinel-2 MSI Level-2A Technical Description.</em> Copernicus Programme.\n                </div>\n                <div class=\"ref-item\">\n                  <strong>[10] Planetary Computer:</strong> Microsoft. <em>Planetary Computer STAC API Documentation.</em>\n                </div>\n              </div>\n            </div>\n            ", "notes": "All references are to tools and papers directly relevant to implemented work. No invented citations."}, {"id": 19, "title": "Project Summary & Engineering Impact", "subtitle": "Core Technical Deliverables & Key Accomplishments", "category": "Conclusion", "branch": "Synthesis", "content": "\n            <div class=\"card\" style=\"margin-bottom:14px; background:linear-gradient(135deg, rgba(30,58,138,0.4) 0%, rgba(15,23,42,0.8) 100%);\">\n              <h3 style=\"color:#38bdf8; margin:0 0 8px 0;\">Summary of Accomplishments</h3>\n              <p style=\"margin:0; font-size:0.95rem; line-height:1.5; color:#cbd5e1;\">TerraPulse / EarthWatch demonstrates a complete, production-grade remote sensing and computer vision platform built entirely on open-source standards and local hardware execution. By systematically combining classical photogrammetry with deep Siamese networks and radiometric physics, the platform solves planetary monitoring challenges without expensive cloud lock-in.</p>\n            </div>\n            <div class=\"grid-4\">\n              <div class=\"metric-card\" style=\"text-align:center;\">\n                <div style=\"font-size:1.8rem; font-weight:800; color:#34d399;\">96.35%</div>\n                <div style=\"font-size:0.8rem; color:#94a3b8; margin-top:4px;\">EuroSAT Val Acc</div>\n                <div style=\"font-size:0.75rem; color:#64748b;\">(ResNet-18)</div>\n              </div>\n              <div class=\"metric-card\" style=\"text-align:center;\">\n                <div style=\"font-size:1.8rem; font-weight:800; color:#38bdf8;\">0.799</div>\n                <div style=\"font-size:0.8rem; color:#94a3b8; margin-top:4px;\">LEVIR-CD F1</div>\n                <div style=\"font-size:0.75rem; color:#64748b;\">(Siamese U-Net)</div>\n              </div>\n              <div class=\"metric-card\" style=\"text-align:center;\">\n                <div style=\"font-size:1.8rem; font-weight:800; color:#f59e0b;\">89.4%</div>\n                <div style=\"font-size:0.8rem; color:#94a3b8; margin-top:4px;\">RANSAC Inliers</div>\n                <div style=\"font-size:0.75rem; color:#64748b;\">(SIFT Stitching)</div>\n              </div>\n              <div class=\"metric-card\" style=\"text-align:center;\">\n                <div style=\"font-size:1.8rem; font-weight:800; color:#ec4899;\">$0.00</div>\n                <div style=\"font-size:0.8rem; color:#94a3b8; margin-top:4px;\">Cloud API Cost</div>\n                <div style=\"font-size:0.75rem; color:#64748b;\">(Local Execution)</div>\n              </div>\n            </div>\n            <div class=\"card\" style=\"margin-top:14px;\">\n              <h4 style=\"color:#10b981; margin:0 0 6px 0;\">Academic & Operational Significance</h4>\n              <ul class=\"styled-list\" style=\"font-size:0.85rem; margin:0;\">\n                <li><strong>Dual Paradigm Mastery:</strong> Demonstrates proficiency in both classical feature detection (SIFT) and modern representation learning (Siamese U-Net).</li>\n                <li><strong>Empirical Rigor:</strong> All claims backed by committed checkpoint logs, strict train/test scene separation, and automated regression tests.</li>\n                <li><strong>Turnkey Reproducibility:</strong> Single command deployment with zero cloud dependencies.</li>\n              </ul>\n            </div>\n            ", "notes": "End on the reproducibility point \u2014 anyone can git clone, pip install -r requirements.txt, streamlit run app.py and see the full platform running in minutes with live satellite data."}, {"id": 20, "title": "Thank You & Technical Q&A", "subtitle": "TerraPulse / EarthWatch \u2014 Open Source Geospatial Intelligence", "category": "Q&A", "branch": "Repository Access", "content": "\n            <div class=\"two-col\">\n              <div class=\"card\" style=\"display:flex; flex-direction:column; justify-content:center;\">\n                <h3 style=\"color:#38bdf8; margin:0 0 8px 0;\">Demonstration & Codebase Access</h3>\n                <p style=\"font-size:0.9rem; color:#cbd5e1; margin-bottom:16px;\">The entire project codebase, model weights, and interactive dashboards are fully reproducible and accessible via GitHub.</p>\n                <div class=\"code-block\" style=\"font-size:0.85rem; margin-bottom:16px;\">\n                  git clone https://github.com/sachetan-inchal/terrapulse<br>\n                  pip install -r requirements.txt<br>\n                  streamlit run app.py\n                </div>\n                <div class=\"metric-card\">\n                  <div class=\"metric-title\">Live Demonstration Ready</div>\n                  <div class=\"metric-desc\">Interactive Streamlit dashboard active at <code>localhost:8501</code> ready for live evaluator queries across any global coordinate.</div>\n                </div>\n              </div>\n              <div class=\"card\" style=\"text-align:center; display:flex; flex-direction:column; justify-content:center; align-items:center;\">\n                <img src=\"stitched_result.jpg\" alt=\"Final Satellite Stitch\" style=\"width:100%; max-height:220px; object-fit:cover; border-radius:8px; border:1px solid #334155;\" onerror=\"this.parentElement.innerHTML='<div class=\\'img-placeholder\\'>\ud83d\udef0\ufe0f Satellite Mosaic Visual<br><small>stitched_result.jpg</small></div>';\">\n                <div style=\"margin-top:12px; font-weight:700; color:#f8fafc; font-size:1.1rem;\">Team 37 \u2014 CCVR Project Presentation</div>\n                <div style=\"font-size:0.85rem; color:#94a3b8; margin-top:4px;\">Questions & Academic Discussion Welcome</div>\n              </div>\n            </div>\n            ", "notes": "Keep this slide clean. Invite questions. Have the live Streamlit app ready on a second screen."}];
    let currentIndex = 0;
    let notesOpen = false;

    function renderSlide(index) {
      if (index < 0 || index >= slides.length) return;
      currentIndex = index;
      const slide = slides[index];

      // Update card elements
      document.getElementById('slide-title').innerText = slide.title;
      document.getElementById('slide-subtitle').innerText = slide.subtitle;
      document.getElementById('slide-category').innerText = slide.category;
      
      const branchEl = document.getElementById('slide-branch');
      branchEl.innerText = slide.branch;
      branchEl.className = 'branch-tag ' + (
        slide.branch.includes('main') ? 'branch-main' :
        slide.branch.includes('earthwatch') ? 'branch-earthwatch' :
        slide.branch.includes('osint') ? 'branch-osint' : 'branch-main'
      );

      document.getElementById('slide-content').innerHTML = slide.content;
      document.getElementById('notes-text').innerText = slide.notes;

      // Update counter and progress
      const num = String(index + 1).padStart(2, '0');
      const total = String(slides.length).padStart(2, '0');
      document.getElementById('slide-counter').innerText = `${num} / ${total}`;
      
      const pct = ((index + 1) / slides.length) * 100;
      document.getElementById('progress-bar').style.width = `${pct}%`;

      // Update dropdown
      document.getElementById('slide-select').value = index;

      // Reset scroll on slide change
      document.getElementById('slide-viewport').scrollTop = 0;
    }

    function nextSlide() {
      if (currentIndex < slides.length - 1) {
        renderSlide(currentIndex + 1);
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        renderSlide(currentIndex - 1);
      }
    }

    function jumpToSlide(idx) {
      renderSlide(parseInt(idx, 10));
    }

    function toggleNotes() {
      notesOpen = !notesOpen;
      const drawer = document.getElementById('notes-drawer');
      const btn = document.getElementById('notes-toggle-btn');
      if (notesOpen) {
        drawer.classList.add('open');
        btn.classList.add('btn-active');
      } else {
        drawer.classList.remove('open');
        btn.classList.remove('btn-active');
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.error(`Fullscreen request failed: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Populate dropdown
    const selectEl = document.getElementById('slide-select');
    slides.forEach((s, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.text = `Slide ${String(i+1).padStart(2, '0')}: ${s.title}`;
      selectEl.appendChild(opt);
    });

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'Home') {
        e.preventDefault();
        renderSlide(0);
      } else if (e.key === 'End') {
        e.preventDefault();
        renderSlide(slides.length - 1);
      } else if (e.key === 'n' || e.key === 'N') {
        e.preventDefault();
        toggleNotes();
      } else if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        toggleFullscreen();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        window.print();
      }
    });

    // Initial render
    renderSlide(0);
  </script>
