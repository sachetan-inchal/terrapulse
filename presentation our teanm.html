<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TerraPulse / EarthWatch — CCVR Project Presentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #070b14;
      --bg-card: rgba(15, 23, 42, 0.75);
      --bg-card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --accent-purple: #a855f7;
      --accent-pink: #ec4899;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --font-main: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.08) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(16, 185, 129, 0.04) 0px, transparent 50%);
    }

    /* Top Progress Bar */
    #progress-container {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.05);
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
    }

    #progress-bar {
      height: 100%;
      width: 5%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-emerald), var(--accent-purple));
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Top Header Bar */
    header {
      padding: 12px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--bg-card-border);
      background: rgba(7, 11, 20, 0.85);
      backdrop-filter: blur(12px);
      z-index: 50;
    }

    .logo-zone {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-emerald));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #070b14;
      font-size: 1.1rem;
    }

    .logo-text {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-center {
      font-size: 0.85rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid var(--bg-card-border);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--bg-card-border);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .btn-active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    /* Slide Stage */
    #slide-viewport {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 32px 80px 32px;
      overflow-y: auto;
      position: relative;
    }

    .slide-card {
      width: 100%;
      max-width: 1200px;
      min-height: 580px;
      background: var(--bg-card);
      border: 1px solid var(--bg-card-border);
      border-radius: 18px;
      padding: 32px 40px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .slide-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--bg-card-border);
    }

    .slide-title-area h2 {
      font-size: 1.85rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .slide-title-area p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .slide-badge-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .slide-body {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Presenter Notes Drawer */
    #notes-drawer {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      width: calc(100% - 64px);
      max-width: 1200px;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 14px;
      padding: 16px 24px;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(20px);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 90;
    }

    #notes-drawer.open {
      transform: translateX(-50%) translateY(0);
    }

    .notes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .notes-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .notes-content {
      font-size: 0.95rem;
      color: #e2e8f0;
      line-height: 1.5;
    }

    /* Bottom Control Bar */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(7, 11, 20, 0.92);
      border-top: 1px solid var(--bg-card-border);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 32px;
      z-index: 50;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .footer-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--bg-card-border);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .slide-counter {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      font-weight: 600;
      color: #ffffff;
      padding: 0 8px;
    }

    .jump-select {
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-main);
      border: 1px solid var(--bg-card-border);
      padding: 6px 12px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
    }

    /* Layout Components */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .card {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--bg-card-border);
      border-radius: 12px;
      padding: 18px 20px;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .badge-accent { background: rgba(56, 189, 248, 0.15); color: var(--accent-cyan); border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge-emerald { background: rgba(16, 185, 129, 0.15); color: var(--accent-emerald); border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-purple { background: rgba(168, 85, 247, 0.15); color: var(--accent-purple); border: 1px solid rgba(168, 85, 247, 0.3); }
    .badge-sky { background: rgba(14, 165, 233, 0.15); color: #38bdf8; border: 1px solid rgba(14, 165, 233, 0.3); }

    .branch-tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
    }
    .branch-main { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
    .branch-earthwatch { background: rgba(16, 185, 129, 0.2); color: #10b981; }
    .branch-osint { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }

    .styled-list {
      list-style: none;
      padding: 0;
    }

    .styled-list li {
      position: relative;
      padding-left: 20px;
      margin-bottom: 8px;
      font-size: 0.9rem;
      line-height: 1.45;
      color: #cbd5e1;
    }

    .styled-list li::before {
      content: "▹";
      position: absolute;
      left: 0;
      color: var(--accent-cyan);
      font-size: 1rem;
    }

    .styled-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    .styled-table th {
      text-align: left;
      padding: 10px 14px;
      background: rgba(30, 41, 59, 0.6);
      color: #e2e8f0;
      font-weight: 600;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .styled-table td {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
    }

    .styled-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .table-container {
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid var(--bg-card-border);
      border-radius: 12px;
      overflow: hidden;
    }

    .metric-card {
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid var(--bg-card-border);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 10px;
    }

    .metric-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .metric-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .alert-warning {
      background: rgba(245, 158, 11, 0.1);
      border-left: 4px solid var(--accent-amber);
      padding: 12px 16px;
      border-radius: 0 8px 8px 0;
      color: #fde68a;
      font-size: 0.88rem;
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.1);
      border-left: 4px solid var(--accent-emerald);
      padding: 12px 16px;
      border-radius: 0 8px 8px 0;
      color: #a7f3d0;
      font-size: 0.88rem;
    }

    .code-block {
      background: #020617;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px 16px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      line-height: 1.5;
      color: #93c5fd;
      overflow-x: auto;
    }

    /* Hero / Slide 1 Special */
    .hero-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .hero-badge-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 24px;
      align-items: center;
    }

    .hero-card {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--bg-card-border);
      border-radius: 14px;
      padding: 24px;
    }

    .hero-preview-box {
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--bg-card-border);
      background: #020617;
      position: relative;
    }

    .hero-img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
    }

    .caption {
      padding: 8px 12px;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(15, 23, 42, 0.9);
      border-top: 1px solid var(--bg-card-border);
    }

    .img-placeholder {
      height: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #94a3b8;
      font-size: 1rem;
    }

    .stat-row {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }

    .stat-pill {
      flex: 1;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--bg-card-border);
      border-radius: 10px;
      padding: 10px 14px;
      text-align: center;
    }

    .stat-val {
      display: block;
      font-size: 1.3rem;
      font-weight: 800;
      color: #ffffff;
      font-family: var(--font-mono);
    }

    .stat-lbl {
      display: block;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 2px;
      text-transform: uppercase;
    }

    /* Architecture Visual Blocks */
    .arch-box {
      padding: 14px 18px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 6px;
      background: rgba(30, 41, 59, 0.5);
    }
    .arch-arrow {
      text-align: center;
      color: var(--accent-cyan);
      font-size: 0.8rem;
      margin: 2px 0;
    }
    .tier3 { border-color: rgba(168, 85, 247, 0.4); background: rgba(168, 85, 247, 0.1); }
    .tier2 { border-color: rgba(56, 189, 248, 0.4); background: rgba(56, 189, 248, 0.1); }
    .tier1 { border-color: rgba(16, 185, 129, 0.4); background: rgba(16, 185, 129, 0.1); }

    /* Feature Cards */
    .feature-card {
      display: flex;
      flex-direction: column;
    }

    .feature-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      margin-bottom: 8px;
    }

    /* Pipeline Flow */
    .pipeline-flow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .pipe-step {
      flex: 1;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--bg-card-border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .pipe-header {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent-cyan);
      margin-bottom: 4px;
    }

    .pipe-body {
      font-size: 0.72rem;
      color: #cbd5e1;
      line-height: 1.3;
    }

    .pipe-arrow {
      color: var(--text-muted);
      font-weight: bold;
      font-size: 1.1rem;
    }

    /* Ref item */
    .ref-item {
      margin-bottom: 10px;
      font-size: 0.8rem;
      line-height: 1.45;
      color: #cbd5e1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      padding-bottom: 8px;
    }

    /* Horizon card */
    .horizon-card {
      position: relative;
    }

    .horizon-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      color: #ffffff;
      padding: 3px 8px;
      border-radius: 4px;
    }

    /* Print Styles */
    @media print {
      body {
        background: #0f172a !important;
        overflow: visible !important;
        height: auto !important;
      }
      header, footer, #progress-container, #notes-drawer {
        display: none !important;
      }
      #slide-viewport {
        padding: 0 !important;
        display: block !important;
      }
      .slide-card {
        page-break-after: always;
        break-after: page;
        min-height: 100vh;
        border: none !important;
        box-shadow: none !important;
        max-width: 100% !important;
        border-radius: 0 !important;
        padding: 24px !important;
      }
    }
  </style>
</head>
<body>

  <!-- Top Progress Bar -->
  <div id="progress-container">
    <div id="progress-bar"></div>
  </div>

  <!-- Header -->
  <header>
    <div class="logo-zone">
      <div class="logo-mark">TP</div>
      <div>
        <div class="logo-text">TERRAPULSE</div>
      </div>
    </div>
    <div class="header-center">
      Computer & Communication Vision Research (CCVR) · Team 37
    </div>
    <div class="header-actions">
      <button class="btn" id="notes-toggle-btn" onclick="toggleNotes()" title="Toggle Presenter Notes (N)">
        <span>🎙️</span> Notes (N)
      </button>
      <button class="btn" onclick="toggleFullscreen()" title="Toggle Fullscreen (F)">
        <span>⛶</span> Fullscreen (F)
      </button>
      <button class="btn" onclick="window.print()" title="Print / Save PDF (P)">
        <span>🖨️</span> PDF
      </button>
    </div>
  </header>

  <!-- Slide Viewport -->
  <main id="slide-viewport">
    <div class="slide-card" id="current-slide-card">
      <div class="slide-header">
        <div class="slide-title-area">
          <h2 id="slide-title">Slide Title</h2>
          <p id="slide-subtitle">Slide Subtitle</p>
        </div>
        <div class="slide-badge-box">
          <span class="badge badge-accent" id="slide-category">Category</span>
          <span class="branch-tag" id="slide-branch">Branch</span>
        </div>
      </div>
      <div class="slide-body" id="slide-content">
        <!-- Rendered Slide Body -->
      </div>
    </div>
  </main>

  <!-- Presenter Notes Drawer -->
  <div id="notes-drawer">
    <div class="notes-header">
      <div class="notes-title">🎙️ Presenter Notes & Oral Defenses</div>
      <button class="btn" style="padding:2px 8px; font-size:0.75rem;" onclick="toggleNotes()">Close</button>
    </div>
    <div class="notes-content" id="notes-text">
      Presenter notes will appear here.
    </div>
  </div>

  <!-- Footer Navigation -->
  <footer>
    <div class="footer-left">
      <span>Use <strong>← / →</strong> or <strong>Space</strong> to navigate</span>
      <span>·</span>
      <span>Press <strong>N</strong> for notes</span>
      <span>·</span>
      <span>Press <strong>F</strong> for fullscreen</span>
    </div>
    <div class="footer-controls">
      <button class="nav-btn" onclick="prevSlide()" title="Previous Slide (←)">‹</button>
      <div class="slide-counter" id="slide-counter">01 / 20</div>
      <button class="nav-btn" onclick="nextSlide()" title="Next Slide (→)">›</button>
      <select class="jump-select" id="slide-select" onchange="jumpToSlide(this.value)">
        <!-- Options populated dynamically -->
      </select>
    </div>
  </footer>

  <script>
    const slides = [{"id": 1, "title": "TerraPulse / EarthWatch", "subtitle": "Planetary-Scale Geospatial Vision & Spatiotemporal Earth Intelligence Platform", "category": "Project Overview", "branch": "Consolidated (All Branches)", "content": "\n            <div class=\"hero-container\">\n              <div class=\"hero-badge-group\">\n                <span class=\"badge badge-accent\">Course: CCVR</span>\n                <span class=\"badge badge-purple\">Team 37</span>\n                <span class=\"badge badge-emerald\">License: MIT</span>\n                <span class=\"badge badge-sky\">Python 3.12 \u00b7 PyTorch \u00b7 OpenCV \u00b7 Streamlit</span>\n              </div>\n              <div class=\"hero-grid\">\n                <div class=\"hero-card\">\n                  <h3 style=\"color:#38bdf8; margin-top:0;\">\ud83c\udf10 The Vision</h3>\n                  <p>An end-to-end computer vision and remote sensing system delivering <strong>zero-cloud-cost</strong> planetary monitoring, automated bi-temporal change detection, land-cover classification, classical tile stitching, and autonomous OSINT intelligence generation.</p>\n                  <div class=\"stat-row\">\n                    <div class=\"stat-pill\"><span class=\"stat-val\">96.35%</span><span class=\"stat-lbl\">Val Acc (EuroSAT)</span></div>\n                    <div class=\"stat-pill\"><span class=\"stat-val\">0.799</span><span class=\"stat-lbl\">F1 Score (LEVIR-CD)</span></div>\n                    <div class=\"stat-pill\"><span class=\"stat-val\">89.4%</span><span class=\"stat-lbl\">SIFT Inlier Ratio</span></div>\n                  </div>\n                </div>\n                <div class=\"hero-preview-box\">\n                  <img src=\"stitched_result.jpg\" alt=\"Satellite Mosaic\" class=\"hero-img\" onerror=\"this.parentElement.innerHTML='<div class=\\'img-placeholder\\'>\ud83d\udef0\ufe0f Satellite Mosaic Visual<br><small>stitched_result.jpg</small></div>';\">\n                  <div class=\"caption\">Figure: Seamless 2-Tile Satellite Mosaic generated by SIFT + RANSAC homography</div>\n                </div>\n              </div>\n            </div>\n            ", "notes": "Open with the satellite mosaic visible on screen. Introduce TerraPulse as an end-to-end remote sensing & CV pipeline developed incrementally across three branches: earthwatch, feature/geospatial-cv-osint, and main."}, {"id": 2, "title": "Problem Statement", "subtitle": "The High-Velocity Planetary Remote Sensing Challenge", "category": "Academic Context", "branch": "Problem Context", "content": "\n            <div class=\"two-col\">\n              <div>\n                <div class=\"card alert-warning\">\n                  <h4 style=\"margin:0 0 8px 0; color:#fbbf24;\">\u26a0\ufe0f The Planetary Data Deluge</h4>\n                  <p style=\"margin:0; font-size:0.95rem; line-height:1.5;\">Satellite constellations (e.g., ESA Sentinel-2, Landsat) generate <strong>terabytes of multi-spectral imagery every 24 hours</strong>. However, extracting actionable insight is bottle-necked by expensive cloud clusters, proprietary GIS software, and slow manual photo-interpretation.</p>\n                </div>\n                <div class=\"card\" style=\"margin-top:16px;\">\n                  <h4 style=\"margin:0 0 10px 0; color:#38bdf8;\">Core Research Questions</h4>\n                  <ul class=\"styled-list\">\n                    <li><strong>Compact DL:</strong> Can a lightweight model achieve state-of-the-art land-cover classification on consumer hardware (MPS/local GPUs)?</li>\n                    <li><strong>Bi-Temporal Detection:</strong> Can deep Siamese networks isolate fine-grained structural changes (urban growth, deforestation) without cloud compute?</li>\n                    <li><strong>Classical Photogrammetry:</strong> Can classical SIFT/RANSAC stitch large multi-tile satellite scenes seamlessly?</li>\n                    <li><strong>Autonomous OSINT:</strong> Can quantitative spectral change vectors be converted directly into tactical intelligence dossiers?</li>\n                  </ul>\n                </div>\n              </div>\n              <div>\n                <div class=\"card\">\n                  <h4 style=\"margin:0 0 12px 0; color:#10b981;\">Target Operational Requirements</h4>\n                  <div class=\"metric-card\">\n                    <div class=\"metric-title\">Zero API Costs for Core Operation</div>\n                    <div class=\"metric-desc\">Free public cloud endpoints (Microsoft Planetary Computer STAC) with decimation streaming.</div>\n                  </div>\n                  <div class=\"metric-card\">\n                    <div class=\"metric-title\">Consumer Hardware Compatibility</div>\n                    <div class=\"metric-desc\">Trained and validated on local Apple Silicon M-series & NVIDIA RTX 3050 hardware.</div>\n                  </div>\n                  <div class=\"metric-card\">\n                    <div class=\"metric-title\">Multi-Disciplinary Synthesis</div>\n                    <div class=\"metric-desc\">Bridges classical feature engineering (SIFT/FLANN) + deep learning (Siamese U-Net) + OSINT risk heuristics.</div>\n                  </div>\n                </div>\n              </div>\n            </div>\n            ", "notes": "Emphasise that everything runs on a local machine (Apple Silicon MPS / NVIDIA RTX 3050), not cloud GPUs. No paid API keys required for core functionality."}, {"id": 3, "title": "Project Objectives & Status", "subtitle": "Concrete Engineering Deliverables Aligned with CCVR Scope", "category": "Scope & Objectives", "branch": "All Branches", "content": "\n            <div class=\"table-container\">\n              <table class=\"styled-table\">\n                <thead>\n                  <tr>\n                    <th style=\"width:50px;\">#</th>\n                    <th>Objective Description</th>\n                    <th>Key Technology / Dataset</th>\n                    <th style=\"width:160px;\">Target</th>\n                    <th style=\"width:180px;\">Status Achieved</th>\n                  </tr>\n                </thead>\n                <tbody>\n                  <tr>\n                    <td><strong>1</strong></td>\n                    <td><strong>Land-Cover Classification</strong></td>\n                    <td>ResNet-18 / EuroSAT (10 classes)</td>\n                    <td>Val Acc \u2265 85.0%</td>\n                    <td><span class=\"badge badge-emerald\">\u2705 96.35% Val Acc</span></td>\n                  </tr>\n                  <tr>\n                    <td><strong>2</strong></td>\n                    <td><strong>Bi-Temporal Change Detection</strong></td>\n                    <td>Siamese U-Net / LEVIR-CD</td>\n                    <td>Test F1 \u2265 0.70</td>\n                    <td><span class=\"badge badge-emerald\">\u2705 F1 = 0.799, IoU = 0.665</span></td>\n                  </tr>\n                  <tr>\n                    <td><strong>3</strong></td>\n                    <td><strong>Multi-Tile Scene Mosaicking</strong></td>\n                    <td>SIFT + FLANN + RANSAC homography</td>\n                    <td>Inliers \u2265 25%</td>\n                    <td><span class=\"badge badge-emerald\">\u2705 89.4% Inlier Ratio</span></td>\n                  </tr>\n                  <tr>\n                    <td><strong>4</strong></td>\n                    <td><strong>Live Satellite Data Streaming</strong></td>\n                    <td>Planetary Computer STAC + rasterio COG</td>\n                    <td>Zero-download stream</td>\n                    <td><span class=\"badge badge-emerald\">\u2705 Operational Worldwide</span></td>\n                  </tr>\n                  <tr>\n                    <td><strong>5</strong></td>\n                    <td><strong>Radiometric Index Engine</strong></td>\n                    <td>NDVI, NDWI, NDBI, SAVI, BSI, EVI</td>\n                    <td>6 Spectral Indices</td>\n                    <td><span class=\"badge badge-emerald\">\u2705 Implemented (\u03b5=10\u207b\u2075)</span></td>\n                  </tr>\n                  <tr>\n                    <td><strong>6</strong></td>\n                    <td><strong>Autonomous OSINT Engine</strong></td>\n                    <td>5x5 Transition Matrix + EVI Heuristics</td>\n                    <td>Automated Dossiers</td>\n                    <td><span class=\"badge badge-emerald\">\u2705 Markdown & JSON Telemetry</span></td>\n                  </tr>\n                  <tr>\n                    <td><strong>7</strong></td>\n                    <td><strong>Unified Interactive Web UI</strong></td>\n                    <td>Streamlit 5-tab application</td>\n                    <td>End-to-end integration</td>\n                    <td><span class=\"badge badge-emerald\">\u2705 app.py (Localhost:8501)</span></td>\n                  </tr>\n                  <tr>\n                    <td><strong>8</strong></td>\n                    <td><strong>Spatiotemporal World Model</strong></td>\n                    <td>EarthTilePackage Dataclass Schema</td>\n                    <td>Future Architecture</td>\n                    <td><span class=\"badge badge-purple\">\ud83d\udd2c Schema / Roadmap Preview</span></td>\n                  </tr>\n                </tbody>\n              </table>\n            </div>\n            ", "notes": "The table uses only results pulled directly from PROGRESS.md and the training CSV logs. The future world model is a schema + UI preview \u2014 it is NOT a trained model."}, {"id": 4, "title": "System Architecture Overview", "subtitle": "Three-Branch Evolutionary Development Merged into One Unified Platform", "category": "Architecture", "branch": "Branch Comparison", "content": "\n            <div class=\"two-col\">\n              <div>\n                <div class=\"card\" style=\"margin-bottom:12px; border-left:4px solid #10b981;\">\n                  <span class=\"branch-tag branch-earthwatch\">branch: earthwatch</span>\n                  <h4 style=\"margin:4px 0 6px 0; color:#10b981;\">Core Deep Learning Pipeline (Tiers 0\u20134)</h4>\n                  <p style=\"font-size:0.85rem; margin:0; color:#cbd5e1;\">PyTorch ResNet-18 classifier, Siamese U-Net change detector, EuroSAT/LEVIR-CD data preparation pipelines, and Streamlit dashboard.</p>\n                </div>\n                <div class=\"card\" style=\"margin-bottom:12px; border-left:4px solid #f59e0b;\">\n                  <span class=\"branch-tag branch-osint\">branch: feature/geospatial-cv-osint</span>\n                  <h4 style=\"margin:4px 0 6px 0; color:#f59e0b;\">TerraPulse Library & Autonomous OSINT</h4>\n                  <p style=\"font-size:0.85rem; margin:0; color:#cbd5e1;\">Independent <code>terrapulse</code> package: 6 radiometric indices + SCL cloud mask, 5x5 land-cover transition matrix, EVI vulnerability scoring, robust feature matcher, and full CLI.</p>\n                </div>\n                <div class=\"card\" style=\"border-left:4px solid #38bdf8;\">\n                  <span class=\"branch-tag branch-main\">branch: main</span>\n                  <h4 style=\"margin:4px 0 6px 0; color:#38bdf8;\">Unified Platform & Live STAC Engine</h4>\n                  <p style=\"font-size:0.85rem; margin:0; color:#cbd5e1;\">Merged 5-tab dashboard (<code>app.py</code>): Planetary Computer STAC query, on-the-fly cross-UTM reprojection, Model Architecture Studio, SIFT stitching tab, and Future Simulator.</p>\n                </div>\n              </div>\n              <div>\n                <div class=\"card\" style=\"height:100%; display:flex; flex-direction:column; justify-content:center;\">\n                  <h4 style=\"margin:0 0 10px 0; color:#94a3b8; text-transform:uppercase; font-size:0.8rem; letter-spacing:0.05em;\">Architectural Tier Stack</h4>\n                  <div class=\"arch-box tier3\">\n                    <strong>Tier 3: Presentation & Intelligence Tier</strong>\n                    <div style=\"font-size:0.8rem; color:#cbd5e1;\">5-Tab Streamlit App \u00b7 OSINT Dossier Generator \u00b7 Gradio Studio</div>\n                  </div>\n                  <div class=\"arch-arrow\">\u25bc</div>\n                  <div class=\"arch-box tier2\">\n                    <strong>Tier 2: Perception & Computer Vision Tier</strong>\n                    <div style=\"font-size:0.8rem; color:#cbd5e1;\">ResNet-18 (EuroSAT) \u00b7 Siamese U-Net (LEVIR-CD) \u00b7 SIFT/FLANN/RANSAC</div>\n                  </div>\n                  <div class=\"arch-arrow\">\u25bc</div>\n                  <div class=\"arch-box tier1\">\n                    <strong>Tier 1: Geospatial Ingestion Tier</strong>\n                    <div style=\"font-size:0.8rem; color:#cbd5e1;\">Microsoft Planetary Computer STAC \u00b7 rasterio COG streaming \u00b7 Nominatim</div>\n                  </div>\n                </div>\n              </div>\n            </div>\n            ", "notes": "Walk through how each branch contributed a distinct layer. earthwatch = DL core. geospatial-cv-osint = radiometrics + OSINT library. main = integration shell + live STAC."}, {"id": 5, "title": "Data Acquisition & Leakage Prevention", "subtitle": "Publicly Available, Zero-Cost Datasets with Methodological Safeguards", "category": "Dataset Methodology", "branch": "Tiers 1-2", "content": "\n            <div class=\"two-col\">\n              <div class=\"card\">\n                <h4 style=\"color:#38bdf8; margin:0 0 12px 0;\">Dataset Ingestion Specs</h4>\n                <div class=\"metric-card\">\n                  <div class=\"metric-title\">EuroSAT RGB Benchmark</div>\n                  <div class=\"metric-desc\"><strong>27,000 tiles (64\u00d764 px)</strong>, 10 distinct LULC classes derived from Sentinel-2. MD5 verified: <code>c8fa014336c82ac7804f0398fcb19387</code>.<br>\n                  Split: 70% Train (18,900) / 15% Val (4,050) / 15% Test (4,050) stratified per class.</div>\n                </div>\n                <div class=\"metric-card\">\n                  <div class=\"metric-title\">LEVIR-CD Building Change Detection</div>\n                  <div class=\"metric-desc\">Bi-temporal pairs (0.5 m/px Google Earth imagery). Tiled from 1024\u00d71024 into 256\u00d7256 patches.<br>\n                  Split: 52 source pairs \u2192 <strong>832 train tiles</strong>; 12 source pairs \u2192 <strong>192 test tiles</strong>.</div>\n                </div>\n                <div class=\"metric-card\">\n                  <div class=\"metric-title\">Planetary Computer Live STAC</div>\n                  <div class=\"metric-desc\">Global Sentinel-2 L2A COGs with Cloud-Optimized GeoTIFF overview decimation. No local disk storage needed.</div>\n                </div>\n              </div>\n              <div class=\"card\">\n                <h4 style=\"color:#ef4444; margin:0 0 10px 0;\">\ud83d\udee1\ufe0f Critical Methodological Safeguard</h4>\n                <div class=\"alert-warning\" style=\"margin-bottom:14px;\">\n                  <strong>Zero Data Leakage Protocol in LEVIR-CD:</strong><br>\n                  Image pairs are split <em>by original 1024\u00d71024 source scene</em>, NEVER randomly by 256\u00d7256 tiled patches.\n                </div>\n                <p style=\"font-size:0.88rem; color:#cbd5e1; line-height:1.5;\">If patches from the same 1024\u00d71024 scene were randomly assigned to train and test sets, spatial autocorrelation would cause artificial metric inflation (optimistic bias). Our split guarantees that the test set evaluates change on entirely unseen geographic locations.</p>\n                <div class=\"stat-row\" style=\"margin-top:16px;\">\n                  <div class=\"stat-pill\"><span class=\"stat-val\">10</span><span class=\"stat-lbl\">EuroSAT Classes</span></div>\n                  <div class=\"stat-pill\"><span class=\"stat-val\">1,024</span><span class=\"stat-lbl\">LEVIR Patches</span></div>\n                  <div class=\"stat-pill\"><span class=\"stat-val\">100%</span><span class=\"stat-lbl\">Stratified Splits</span></div>\n                </div>\n              </div>\n            </div>\n            ", "notes": "Highlight the deliberate split-by-source-image approach for LEVIR-CD; this is a methodological safeguard documented in PROGRESS.md."}, {"id": 6, "title": "EarthWatch Deep Learning Core", "subtitle": "ResNet-18 Classifier & Siamese U-Net Architecture Design", "category": "Deep Learning Models", "branch": "branch: earthwatch", "content": "\n            <div class=\"two-col\">\n              <div class=\"card\">\n                <h4 style=\"color:#10b981; margin:0 0 8px 0;\">Model 1: Land-Cover Classifier</h4>\n                <ul class=\"styled-list\">\n                  <li><strong>Base Backbone:</strong> <code>ResNet-18</code> with ImageNet pre-trained feature weights.</li>\n                  <li><strong>Head:</strong> Linear projection to 10 land-cover classes (Forest, Residential, River, Highway, Industrial, etc.).</li>\n                  <li><strong>Optimization:</strong> Adam (lr=1e-3), Cross-Entropy loss, Batch size 64.</li>\n                  <li><strong>Hardware:</strong> Pinned PyTorch 2.4.1 targeting Apple Silicon MPS / NVIDIA CUDA.</li>\n                  <li><strong>Checkpoint:</strong> Epoch 10 yields <strong>96.35% Val Acc</strong> (Goal: \u2265 85%).</li>\n                </ul>\n                <h4 style=\"color:#38bdf8; margin:16px 0 8px 0;\">Model 2: Siamese U-Net Change Detector</h4>\n                <ul class=\"styled-list\">\n                  <li><strong>Architecture:</strong> Two weight-sharing encoder towers (Conv-BatchNorm-ReLU-MaxPool).</li>\n                  <li><strong>Multi-Scale Feature Fusion:</strong> Absolute feature distance <code>|f(t\u2081) \u2212 f(t\u2082)|</code> evaluated at 4 encoder scales.</li>\n                  <li><strong>Decoder:</strong> Up-sampling convolutions with residual skip connections.</li>\n                  <li><strong>Compound Loss:</strong> BCE + Dice loss to resolve extreme non-change class imbalance.</li>\n                </ul>\n              </div>\n              <div class=\"card\" style=\"display:flex; flex-direction:column; justify-content:center; align-items:center;\">\n                <h4 style=\"color:#a855f7; margin:0 0 8px 0; align-self:flex-start;\">Siamese U-Net Structural Flow</h4>\n                <svg viewBox=\"0 0 440 320\" style=\"width:100%; max-width:420px; background:rgba(15,23,42,0.6); border-radius:10px; border:1px solid rgba(255,255,255,0.1);\">\n                  <!-- Input T0 -->\n                  <rect x=\"20\" y=\"30\" width=\"80\" height=\"40\" rx=\"6\" fill=\"#1e293b\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n                  <text x=\"60\" y=\"55\" fill=\"#e2e8f0\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">Image t\u2080</text>\n                  <!-- Input T1 -->\n                  <rect x=\"20\" y=\"240\" width=\"80\" height=\"40\" rx=\"6\" fill=\"#1e293b\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n                  <text x=\"60\" y=\"265\" fill=\"#e2e8f0\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">Image t\u2081</text>\n                  <!-- Encoder Tower 1 -->\n                  <rect x=\"130\" y=\"20\" width=\"75\" height=\"60\" rx=\"6\" fill=\"#0f172a\" stroke=\"#10b981\" stroke-width=\"1.5\"/>\n                  <text x=\"167\" y=\"48\" fill=\"#10b981\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">Encoder</text>\n                  <text x=\"167\" y=\"66\" fill=\"#94a3b8\" font-size=\"9\" text-anchor=\"middle\">4 Scales</text>\n                  <!-- Encoder Tower 2 -->\n                  <rect x=\"130\" y=\"230\" width=\"75\" height=\"60\" rx=\"6\" fill=\"#0f172a\" stroke=\"#10b981\" stroke-width=\"1.5\"/>\n                  <text x=\"167\" y=\"258\" fill=\"#10b981\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">Encoder</text>\n                  <text x=\"167\" y=\"276\" fill=\"#94a3b8\" font-size=\"9\" text-anchor=\"middle\">Shared Wts</text>\n                  <!-- Connecting lines -->\n                  <line x1=\"100\" y1=\"50\" x2=\"130\" y2=\"50\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n                  <line x1=\"100\" y1=\"260\" x2=\"130\" y2=\"260\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n                  <!-- Shared weights link -->\n                  <line x1=\"167\" y1=\"80\" x2=\"167\" y2=\"230\" stroke=\"#f59e0b\" stroke-width=\"1.5\" stroke-dasharray=\"4,4\"/>\n                  <text x=\"175\" y=\"155\" fill=\"#f59e0b\" font-size=\"10\" transform=\"rotate(-90 175,155)\">Weight Sharing</text>\n                  <!-- Absolute Diff Block -->\n                  <rect x=\"235\" y=\"120\" width=\"75\" height=\"70\" rx=\"6\" fill=\"#312e81\" stroke=\"#818cf8\" stroke-width=\"1.5\"/>\n                  <text x=\"272\" y=\"148\" fill=\"#c7d2fe\" font-size=\"10\" font-weight=\"bold\" text-anchor=\"middle\">|f(t\u2080)-f(t\u2081)|</text>\n                  <text x=\"272\" y=\"166\" fill=\"#94a3b8\" font-size=\"9\" text-anchor=\"middle\">Multi-Scale</text>\n                  <text x=\"272\" y=\"180\" fill=\"#94a3b8\" font-size=\"9\" text-anchor=\"middle\">Diff Fusion</text>\n                  <path d=\"M 205 50 L 235 140\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n                  <path d=\"M 205 260 L 235 170\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n                  <!-- Decoder -->\n                  <rect x=\"335\" y=\"125\" width=\"80\" height=\"60\" rx=\"6\" fill=\"#1e1b4b\" stroke=\"#ec4899\" stroke-width=\"1.5\"/>\n                  <text x=\"375\" y=\"152\" fill=\"#f472b6\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">U-Net Dec</text>\n                  <text x=\"375\" y=\"170\" fill=\"#94a3b8\" font-size=\"9\" text-anchor=\"middle\">BCE + Dice</text>\n                  <line x1=\"310\" y1=\"155\" x2=\"335\" y2=\"155\" stroke=\"#ec4899\" stroke-width=\"2\"/>\n                  <!-- Output -->\n                  <text x=\"375\" y=\"210\" fill=\"#34d399\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">Change Mask</text>\n                </svg>\n              </div>\n            </div>\n            ", "notes": "Both benchmarks exceeded their stated Definitions of Done on the first or second training attempt, with no cloud GPU required."}, {"id": 7, "title": "Empirical Training Results", "subtitle": "Actual Convergence Logs Sourced from Checkpoint Files", "category": "Experimental Validation", "branch": "branch: earthwatch", "content": "\n            <div class=\"two-col\">\n              <div>\n                <div class=\"card\">\n                  <h4 style=\"margin:0 0 8px 0; color:#38bdf8;\">EuroSAT Classifier (ResNet-18)</h4>\n                  \n    <svg viewBox=\"0 0 540 240\" class=\"chart-svg\" style=\"width:100%; height:auto; background:rgba(15,23,42,0.6); border-radius:12px; border:1px solid rgba(255,255,255,0.1);\">\n      <line x1=\"40\" y1=\"200.0\" x2=\"500\" y2=\"200.0\" stroke=\"rgba(255,255,255,0.08)\" stroke-dasharray=\"3,3\" /><text x=\"32\" y=\"204.0\" font-size=\"10\" fill=\"#94a3b8\" text-anchor=\"end\" font-family=\"monospace\">80%</text><line x1=\"40\" y1=\"160.0\" x2=\"500\" y2=\"160.0\" stroke=\"rgba(255,255,255,0.08)\" stroke-dasharray=\"3,3\" /><text x=\"32\" y=\"164.0\" font-size=\"10\" fill=\"#94a3b8\" text-anchor=\"end\" font-family=\"monospace\">85%</text><line x1=\"40\" y1=\"120.0\" x2=\"500\" y2=\"120.0\" stroke=\"rgba(255,255,255,0.08)\" stroke-dasharray=\"3,3\" /><text x=\"32\" y=\"124.0\" font-size=\"10\" fill=\"#94a3b8\" text-anchor=\"end\" font-family=\"monospace\">90%</text><line x1=\"40\" y1=\"80.0\" x2=\"500\" y2=\"80.0\" stroke=\"rgba(255,255,255,0.08)\" stroke-dasharray=\"3,3\" /><text x=\"32\" y=\"84.0\" font-size=\"10\" fill=\"#94a3b8\" text-anchor=\"end\" font-family=\"monospace\">95%</text><line x1=\"40\" y1=\"40.0\" x2=\"500\" y2=\"40.0\" stroke=\"rgba(255,255,255,0.08)\" stroke-dasharray=\"3,3\" /><text x=\"32\" y=\"44.0\" font-size=\"10\" fill=\"#94a3b8\" text-anchor=\"end\" font-family=\"monospace\">100%</text>\n      <path d=\"M 40.0,153.7 L 72.9,117.5 L 105.7,103.4 L 138.6,96.8 L 171.4,90.8 L 204.3,88.3 L 237.1,84.4 L 270.0,83.2 L 302.9,79.2 L 335.7,78.1 L 368.6,76.9 L 401.4,76.2 L 434.3,77.8 L 467.1,74.7 L 500.0,70.9\" fill=\"none\" stroke=\"#38bdf8\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" /><path d=\"M 40.0,110.3 L 72.9,116.8 L 105.7,115.7 L 138.6,83.1 L 171.4,141.1 L 204.3,80.3 L 237.1,118.8 L 270.0,82.3 L 302.9,90.4 L 335.7,69.2 L 368.6,148.0 L 401.4,74.0 L 434.3,77.1 L 467.1,73.6 L 500.0,76.3\" fill=\"none\" stroke=\"#10b981\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" />\n      <circle cx=\"40.0\" cy=\"153.7\" r=\"3.5\" fill=\"#38bdf8\" stroke=\"#0f172a\" stroke-width=\"1.5\"><title>Epoch 1: 0.858</title></circle><circle cx=\"138.6\" cy=\"96.8\" r=\"3.5\" fill=\"#38bdf8\" stroke=\"#0f172a\" stroke-width=\"1.5\"><title>Epoch 4: 0.929</title></circle><circle cx=\"237.1\" cy=\"84.4\" r=\"3.5\" fill=\"#38bdf8\" stroke=\"#0f172a\" stroke-width=\"1.5\"><title>Epoch 7: 0.944</title></circle><circle cx=\"335.7\" cy=\"78.1\" r=\"3.5\" fill=\"#38bdf8\" stroke=\"#0f172a\" stroke-width=\"1.5\"><title>Epoch 10: 0.952</title></circle><circle cx=\"434.3\" cy=\"77.8\" r=\"3.5\" fill=\"#38bdf8\" stroke=\"#0f172a\" stroke-width=\"1.5\"><title>Epoch 13: 0.953</title></circle><circle cx=\"500.0\" cy=\"70.9\" r=\"3.5\" fill=\"#38bdf8\" stroke=\"#0f172a\" stroke-width=\"1.5\"><title>Epoch 15: 0.961</title></circle><circle cx=\"40.0\" cy=\"110.3\" r=\"3.5\" fill=\"#10b981\" stroke=\"#0f172a\" stroke-width=\"1.5\"><title>Epoch 1: 0.912</title></circle><circle cx=\"138.6\" cy=\"83.1\" r=\"3.5\" fill=\"#10b981\" stroke=\"#0f172a\" stroke-width=\"1.5\"><title>Epoch 4: 0.946</title></circle><circle cx=\"237.1\" cy=\"118.8\" r=\"3.5\" fill=\"#10b981\" stroke=\"#0f172a\" stroke-width=\"1.5\"><title>Epoch
