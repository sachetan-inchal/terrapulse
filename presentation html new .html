<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TerraPulse v2.0 — CCVR Project Presentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #070b14;
      --bg-card: rgba(15, 23, 42, 0.75);
      --bg-card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --accent-purple: #a855f7;
      --accent-pink: #ec4899;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --font-main: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.08) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(16, 185, 129, 0.04) 0px, transparent 50%);
    }

    /* Top Progress Bar */
    #progress-container {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.05);
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
    }

    #progress-bar {
      height: 100%;
      width: 5%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-emerald), var(--accent-purple));
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Top Header Bar */
    header {
      padding: 12px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--bg-card-border);
      background: rgba(7, 11, 20, 0.85);
      backdrop-filter: blur(12px);
      z-index: 50;
    }

    .logo-zone {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-mark {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-emerald));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #070b14;
      font-size: 1.05rem;
    }

    .logo-text {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-center {
      font-size: 0.85rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid var(--bg-card-border);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--bg-card-border);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .btn-active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    /* Slide Stage */
    #slide-viewport {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 32px 75px 32px;
      overflow-y: auto;
      position: relative;
    }

    .slide-card {
      width: 100%;
      max-width: 1200px;
      min-height: 560px;
      background: var(--bg-card);
      border: 1px solid var(--bg-card-border);
      border-radius: 18px;
      padding: 28px 36px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .slide-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--bg-card-border);
    }

    .slide-title-area h2 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .slide-title-area p {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-top: 4px;
    }

    .slide-badge-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .slide-body {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Presenter Notes Drawer */
    #notes-drawer {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      width: calc(100% - 64px);
      max-width: 1200px;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 14px;
      padding: 16px 24px;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(20px);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 90;
    }

    #notes-drawer.open {
      transform: translateX(-50%) translateY(0);
    }

    .notes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .notes-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .notes-content {
      font-size: 0.92rem;
      color: #e2e8f0;
      line-height: 1.5;
    }

    /* Bottom Control Bar */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(7, 11, 20, 0.92);
      border-top: 1px solid var(--bg-card-border);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 32px;
      z-index: 50;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .footer-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--bg-card-border);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .slide-counter {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      font-weight: 600;
      color: #ffffff;
      padding: 0 8px;
    }

    .jump-select {
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-main);
      border: 1px solid var(--bg-card-border);
      padding: 6px 12px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
    }

    /* Layout Components */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .card {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--bg-card-border);
      border-radius: 12px;
      padding: 16px 18px;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .badge-accent { background: rgba(56, 189, 248, 0.15); color: var(--accent-cyan); border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge-emerald { background: rgba(16, 185, 129, 0.15); color: var(--accent-emerald); border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-purple { background: rgba(168, 85, 247, 0.15); color: var(--accent-purple); border: 1px solid rgba(168, 85, 247, 0.3); }
    .badge-sky { background: rgba(14, 165, 233, 0.15); color: #38bdf8; border: 1px solid rgba(14, 165, 233, 0.3); }

    .branch-tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
    }
    .branch-main { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
    .branch-earthwatch { background: rgba(16, 185, 129, 0.2); color: #10b981; }
    .branch-osint { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }

    .styled-list {
      list-style: none;
      padding: 0;
    }

    .styled-list li {
      position: relative;
      padding-left: 18px;
      margin-bottom: 6px;
      font-size: 0.88rem;
      line-height: 1.4;
      color: #cbd5e1;
    }

    .styled-list li::before {
      content: "▹";
      position: absolute;
      left: 0;
      color: var(--accent-cyan);
      font-size: 0.95rem;
    }

    .styled-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    .styled-table th {
      text-align: left;
      padding: 8px 12px;
      background: rgba(30, 41, 59, 0.6);
      color: #e2e8f0;
      font-weight: 600;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .styled-table td {
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
    }

    .styled-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .table-container {
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid var(--bg-card-border);
      border-radius: 12px;
      overflow: hidden;
    }

    .metric-card {
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid var(--bg-card-border);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 8px;
    }

    .metric-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 2px;
    }

    .metric-desc {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.35;
    }

    .alert-warning {
      background: rgba(245, 158, 11, 0.1);
      border-left: 4px solid var(--accent-amber);
      padding: 10px 14px;
      border-radius: 0 8px 8px 0;
      color: #fde68a;
      font-size: 0.85rem;
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.1);
      border-left: 4px solid var(--accent-emerald);
      padding: 10px 14px;
      border-radius: 0 8px 8px 0;
      color: #a7f3d0;
      font-size: 0.85rem;
    }

    .code-block {
      background: #020617;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px 14px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      line-height: 1.45;
      color: #93c5fd;
      overflow-x: auto;
    }

    /* Hero / Slide 1 Special */
    .hero-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .hero-badge-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 20px;
      align-items: center;
    }

    .hero-card {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--bg-card-border);
      border-radius: 14px;
      padding: 22px;
    }

    .hero-preview-box {
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--bg-card-border);
      background: #020617;
      position: relative;
    }

    .hero-img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
    }

    .caption {
      padding: 6px 10px;
      font-size: 0.72rem;
      color: var(--text-muted);
      background: rgba(15, 23, 42, 0.9);
      border-top: 1px solid var(--bg-card-border);
    }

    .img-placeholder {
      height: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .stat-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .stat-pill {
      flex: 1;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--bg-card-border);
      border-radius: 8px;
      padding: 8px 10px;
      text-align: center;
    }

    .stat-val {
      display: block;
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      font-family: var(--font-mono);
    }

    .stat-lbl {
      display: block;
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 2px;
      text-transform: uppercase;
    }

    /* Architecture Visual Blocks */
    .arch-box {
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 6px;
      background: rgba(30, 41, 59, 0.5);
    }
    .arch-arrow {
      text-align: center;
      color: var(--accent-cyan);
      font-size: 0.75rem;
      margin: 2px 0;
    }
    .tier3 { border-color: rgba(168, 85, 247, 0.4); background: rgba(168, 85, 247, 0.1); }
    .tier2 { border-color: rgba(56, 189, 248, 0.4); background: rgba(56, 189, 248, 0.1); }
    .tier1 { border-color: rgba(16, 185, 129, 0.4); background: rgba(16, 185, 129, 0.1); }

    /* Feature Cards */
    .feature-card {
      display: flex;
      flex-direction: column;
    }

    /* Pipeline Flow */
    .pipeline-flow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .pipe-step {
      flex: 1;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--bg-card-border);
      border-radius: 8px;
      padding: 10px 8px;
      text-align: center;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .pipe-header {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent-cyan);
      margin-bottom: 4px;
    }

    .pipe-body {
      font-size: 0.70rem;
      color: #cbd5e1;
      line-height: 1.25;
    }

    .pipe-arrow {
      color: var(--text-muted);
      font-weight: bold;
      font-size: 1rem;
    }

    /* Ref item */
    .ref-item {
      margin-bottom: 8px;
      font-size: 0.78rem;
      line-height: 1.4;
      color: #cbd5e1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      padding-bottom: 6px;
    }

    /* Horizon card */
    .horizon-card {
      position: relative;
    }

    .horizon-badge {
      display: inline-block;
      font-size: 0.70rem;
      font-weight: 700;
      color: #ffffff;
      padding: 2px 8px;
      border-radius: 4px;
    }

    /* Print Styles */
    @media print {
      body {
        background: #0f172a !important;
        overflow: visible !important;
        height: auto !important;
      }
      header, footer, #progress-container, #notes-drawer {
        display: none !important;
      }
      #slide-viewport {
        padding: 0 !important;
        display: block !important;
      }
      .slide-card {
        page-break-after: always;
        break-after: page;
        min-height: 100vh;
        border: none !important;
        box-shadow: none !important;
        max-width: 100% !important;
        border-radius: 0 !important;
        padding: 24px !important;
      }
    }
  </style>
</head>
<body>

  <!-- Top Progress Bar -->
  <div id="progress-container">
    <div id="progress-bar"></div>
  </div>

  <!-- Header -->
  <header>
    <div class="logo-zone">
      <div class="logo-mark">TP</div>
      <div>
        <div class="logo-text">TERRAPULSE v2.0</div>
      </div>
    </div>
    <div class="header-center">
      Computer & Communication Vision Research (CCVR) · Team 37
    </div>
    <div class="header-actions">
      <button class="btn" id="notes-toggle-btn" onclick="toggleNotes()" title="Toggle Presenter Notes (N)">
        <span>🎙️</span> Notes (N)
      </button>
      <button class="btn" onclick="toggleFullscreen()" title="Toggle Fullscreen (F)">
        <span>⛶</span> Fullscreen (F)
      </button>
      <button class="btn" onclick="window.print()" title="Print / Save PDF (P)">
        <span>🖨️</span> PDF
      </button>
    </div>
  </header>

  <!-- Slide Viewport -->
  <main id="slide-viewport">
    <div class="slide-card" id="current-slide-card">
      <div class="slide-header">
        <div class="slide-title-area">
          <h2 id="slide-title">Slide Title</h2>
          <p id="slide-subtitle">Slide Subtitle</p>
        </div>
        <div class="slide-badge-box">
          <span class="badge badge-accent" id="slide-category">Category</span>
          <span class="branch-tag" id="slide-branch">Branch</span>
        </div>
      </div>
      <div class="slide-body" id="slide-content">
        <!-- Rendered Slide Body -->
      </div>
    </div>
  </main>

  <!-- Presenter Notes Drawer -->
  <div id="notes-drawer">
    <div class="notes-header">
      <div class="notes-title">🎙️ Presenter Notes & Oral Defenses</div>
      <button class="btn" style="padding:2px 8px; font-size:0.75rem;" onclick="toggleNotes()">Close</button>
    </div>
    <div class="notes-content" id="notes-text">
      Presenter notes will appear here.
    </div>
  </div>

  <!-- Footer Navigation -->
  <footer>
    <div class="footer-left">
      <span>Use <strong>← / →</strong> or <strong>Space</strong> to navigate</span>
      <span>·</span>
      <span>Press <strong>N</strong> for notes</span>
      <span>·</span>
      <span>Press <strong>F</strong> for fullscreen</span>
    </div>
    <div class="footer-controls">
      <button class="nav-btn" onclick="prevSlide()" title="Previous Slide (←)">‹</button>
      <div class="slide-counter" id="slide-counter">01 / 20</div>
      <button class="nav-btn" onclick="nextSlide()" title="Next Slide (→)">›</button>
      <select class="jump-select" id="slide-select" onchange="jumpToSlide(this.value)">
        <!-- Options populated dynamically -->
      </select>
    </div>
  </footer>

  <script>
    const slides = [{"id": 1, "title": "TerraPulse v2.0", "subtitle": "Planetary-Scale Geospatial Vision & Spatiotemporal Earth Intelligence Platform", "category": "Project Overview", "branch": "v2.0 (main)", "content": "\n            <div class=\"hero-container\">\n              <div class=\"hero-badge-group\">\n                <span class=\"badge badge-accent\">Course: CCVR</span>\n                <span class=\"badge badge-purple\">Team 37</span>\n                <span class=\"badge badge-emerald\">License: MIT</span>\n                <span class=\"badge badge-sky\">TerraPulse v2.0 Architecture</span>\n              </div>\n              <div class=\"hero-grid\">\n                <div class=\"hero-card\">\n                  <h3 style=\"color:#38bdf8; margin-top:0;\">\ud83d\udef0\ufe0f The Next-Gen Earth Intelligence Platform</h3>\n                  <p>A unified, data-driven remote sensing and computer vision platform. Synchronizes live Sentinel-2 cloud streaming, automated 4-quadrant mosaic generation, 6 calibrated environmental biophysical layers, bi-temporal split swipe change detection, and an 8-agent evidence synthesis engine.</p>\n                  <div class=\"stat-row\">\n                    <div class=\"stat-pill\"><span class=\"stat-val\">4</span><span class=\"stat-lbl\">Consolidated Workspaces</span></div>\n                    <div class=\"stat-pill\"><span class=\"stat-val\">96.35%</span><span class=\"stat-lbl\">EuroSAT Val Acc</span></div>\n                    <div class=\"stat-pill\"><span class=\"stat-val\">0.799</span><span class=\"stat-lbl\">LEVIR-CD F1 Score</span></div>\n                    <div class=\"stat-pill\"><span class=\"stat-val\">89.4%</span><span class=\"stat-lbl\">SIFT Inlier Ratio</span></div>\n                  </div>\n                </div>\n                <div class=\"hero-preview-box\">\n                  <img src=\"stitched_result.jpg\" alt=\"Satellite Mosaic\" class=\"hero-img\" onerror=\"this.parentElement.innerHTML='<div class=\\'img-placeholder\\'>\ud83d\udef0\ufe0f Satellite Mosaic Visual<br><small>stitched_result.jpg</small></div>';\">\n                  <div class=\"caption\">Figure: 4-Quadrant Fused Satellite Mosaic with Landmark Seam Alignment</div>\n                </div>\n              </div>\n            </div>\n            ", "notes": "Welcome the evaluators. Introduce TerraPulse v2.0 as a comprehensive evolution: moving beyond isolated demonstration tabs into a fully synchronized, data-driven geospatial intelligence platform running locally with zero cloud API costs."}, {"id": 2, "title": "Problem Statement", "subtitle": "Bridging the Chasm Between Satellite Pixels and Grounded Causality", "category": "Academic Context", "branch": "Problem Context", "content": "\n            <div class=\"two-col\">\n              <div>\n                <div class=\"card alert-warning\">\n                  <h4 style=\"margin:0 0 8px 0; color:#fbbf24;\">\u26a0\ufe0f The Satellite Data Deluge & Causality Gap</h4>\n                  <p style=\"margin:0; font-size:0.92rem; line-height:1.5;\">Constellations like Sentinel-2 generate terabytes of optical multi-spectral data daily. However, existing remote sensing tools stop at highlighting *that* a pixel changed, leaving analysts to guess *why* without expensive manual field investigations.</p>\n                </div>\n                <div class=\"card\" style=\"margin-top:14px;\">\n                  <h4 style=\"margin:0 0 10px 0; color:#38bdf8;\">Engineering Questions Addressed</h4>\n                  <ul class=\"styled-list\">\n                    <li><strong>Unified Application State:</strong> Can multi-temporal satellite querying, layer calibration, and change detection be orchestrated under a single reactive state without cache corruption?</li>\n                    <li><strong>Autonomous Calibration:</strong> Can classical photogrammetry (SIFT/RANSAC) and deep Siamese networks operate in tandem with zero manual parameter tuning?</li>\n                    <li><strong>Evidence-Grounded AI:</strong> Can an automated environmental investigator cite peer-reviewed literature and municipal records rather than hallucinating explanations?</li>\n                  </ul>\n                </div>\n              </div>\n              <div>\n                <div class=\"card\">\n                  <h4 style=\"margin:0 0 12px 0; color:#10b981;\">Operational Design Constraints</h4>\n                  <div class=\"metric-card\">\n                    <div class=\"metric-title\">Zero-Cloud-Cost Local Execution</div>\n                    <div class=\"metric-desc\">Stream directly from public cloud STAC catalogs (Planetary Computer) via windowed COG decimation with zero local disk footprint.</div>\n                  </div>\n                  <div class=\"metric-card\">\n                    <div class=\"metric-title\">Single Source of Truth Provenance</div>\n                    <div class=\"metric-desc\">Every layer, metric, and AI inquiry references identical verified satellite acquisition timestamps and coordinates.</div>\n                  </div>\n                  <div class=\"metric-card\">\n                    <div class=\"metric-title\">Consumer Workstation Acceleration</div>\n                    <div class=\"metric-desc\">Validated on local Apple Silicon (MPS) and NVIDIA RTX 3050 hardware.</div>\n                  </div>\n                </div>\n              </div>\n            </div>\n            ", "notes": "Emphasize the shift from 'just running a model on an image' to building a unified, verified intelligence platform that explains environmental transformations with empirical evidence."}, {"id": 3, "title": "Project Objectives & Deliverables", "subtitle": "Concrete Deliverables in the TerraPulse v2.0 Architecture", "category": "Scope & Objectives", "branch": "v2.0 Deliverables", "content": "\n            <div class=\"table-container\">\n              <table class=\"styled-table\">\n                <thead>\n                  <tr>\n                    <th style=\"width:45px;\">#</th>\n                    <th>Engineering Objective</th>\n                    <th>Deliverable in Codebase</th>\n                    <th style=\"width:170px;\">Target Metric</th>\n                    <th style=\"width:190px;\">Status Achieved</th>\n                  </tr>\n                </thead>\n                <tbody>\n                  <tr>\n                    <td><strong>1</strong></td>\n                    <td><strong>Land-Cover Classification</strong></td>\n                    <td>ResNet-18 fine-tuned on EuroSAT (10 classes)</td>\n                    <td>Val Acc \u2265 85.0%</td>\n                    <td><span class=\"badge badge-emerald\">\u2705 96.35% Val Acc (Epoch 10)</span></td>\n                  </tr>\n                  <tr>\n                    <td><strong>2</strong></td>\n                    <td><strong>Bi-Temporal Change Detection</strong></td>\n                    <td>Siamese U-Net on LEVIR-CD (BCE + Dice)</td>\n                    <td>Test F1 \u2265 0.70</td>\n                    <td><span class=\"badge badge-emerald\">\u2705 F1 = 0.799, IoU = 0.665</span></td>\n                  </tr>\n                  <tr>\n                    <td><strong>3</strong></td>\n                    <td><strong>Automated 4-Quadrant Stitching</strong></td>\n                    <td>SIFT + FLANN + RANSAC with seam lines</td>\n                    <td>Inlier Ratio \u2265 25%</td>\n                    <td><span class=\"badge badge-emerald\">\u2705 89.4% Inlier Ratio</span></td>\n                  </tr>\n                  <tr>\n                    <td><strong>4</strong></td>\n                    <td><strong>Unified State Manager</strong></td>\n                    <td><code>AppStateManager</code> single source of truth</td>\n                    <td>Zero state corruption</td>\n                    <td><span class=\"badge badge-emerald\">\u2705 Implemented & Tested</span></td>\n                  </tr>\n                  <tr>\n                    <td><strong>5</strong></td>\n                    <td><strong>6 Biophysical CV Layers</strong></td>\n                    <td>Calibrated NDVI, CIR, NDWI, NDBI, Land, Pop</td>\n                    <td>0\u2013100% Opacity Overlay</td>\n                    <td><span class=\"badge badge-emerald\">\u2705 Operational in km\u00b2</span></td>\n                  </tr>\n                  <tr>\n                    <td><strong>6</strong></td>\n                    <td><strong>Bi-Temporal Split Swipe Slider</strong></td>\n                    <td>Harmonized common-grid swipe comparison</td>\n                    <td>Seamless swipe UX</td>\n                    <td><span class=\"badge badge-emerald\">\u2705 Operational with \u0394NDVI</span></td>\n                  </tr>\n                  <tr>\n                    <td><strong>7</strong></td>\n                    <td><strong>Evidence-Based AI Investigator</strong></td>\n                    <td>8-agent swarm + Causal Graphs + Citations</td>\n                    <td>Verified citations</td>\n                    <td><span class=\"badge badge-emerald\">\u2705 IISc/Springer Citations</span></td>\n                  </tr>\n                  <tr>\n                    <td><strong>8</strong></td>\n                    <td><strong>Spatiotemporal World Model</strong></td>\n                    <td><code>EarthTilePackage</code> multi-modal schema</td>\n                    <td>Future Architecture</td>\n                    <td><span class=\"badge badge-purple\">\ud83d\udd2c Architectural Roadmap</span></td>\n                  </tr>\n                </tbody>\n              </table>\n            </div>\n            ", "notes": "Every objective in the table corresponds to an active module in the codebase. Highlight that the future world model is clearly tagged as an architectural schema/roadmap."}, {"id": 4, "title": "TerraPulse v2.0 System Architecture", "subtitle": "Centralized Application State Connecting 4 Dedicated Workspaces", "category": "Architecture", "branch": "v2.0 Architecture", "content": "\n            <div class=\"two-col\">\n              <div>\n                <div class=\"card\" style=\"margin-bottom:12px; border-left:4px solid #38bdf8;\">\n                  <span class=\"branch-tag branch-main\">AppStateManager</span>\n                  <h4 style=\"margin:4px 0 6px 0; color:#38bdf8;\">Central State & Provenance Controller</h4>\n                  <p style=\"font-size:0.85rem; margin:0; color:#cbd5e1;\">Binds all user interactions to a single source of truth. Manages automatic cache invalidation on location or observation changes, and drives the 6-step guided workflow indicator.</p>\n                </div>\n                <div class=\"grid-4\" style=\"gap:8px; margin-top:12px;\">\n                  <div class=\"card\" style=\"padding:10px; font-size:0.75rem;\">\n                    <strong style=\"color:#38bdf8;\">\ud83c\udf0d Explore</strong><br>\n                    Global search, 3D globe, STAC archive, 4-quadrant mosaic.\n                  </div>\n                  <div class=\"card\" style=\"padding:10px; font-size:0.75rem;\">\n                    <strong style=\"color:#10b981;\">\ud83c\udf3f Analyze</strong><br>\n                    6 biophysical layers, 0\u2013100% opacity slider, km\u00b2 area.\n                  </div>\n                  <div class=\"card\" style=\"padding:10px; font-size:0.75rem;\">\n                    <strong style=\"color:#f59e0b;\">\u2194\ufe0f Compare</strong><br>\n                    Grid alignment, split swipe slider, \u0394NDVI change.\n                  </div>\n                  <div class=\"card\" style=\"padding:10px; font-size:0.75rem;\">\n                    <strong style=\"color:#a855f7;\">\ud83e\udde0 Investigate</strong><br>\n                    8-agent swarm, causal reasoning, citations.\n                  </div>\n                </div>\n              </div>\n              <div>\n                <div class=\"card\" style=\"height:100%; display:flex; flex-direction:column; justify-content:center;\">\n                  <h4 style=\"margin:0 0 8px 0; color:#94a3b8; text-transform:uppercase; font-size:0.8rem; letter-spacing:0.05em;\">Structural System Stack</h4>\n                  <div class=\"arch-box tier3\">\n                    <strong>Workspaces 1\u20134 & Guided 6-Step Indicator</strong>\n                    <div style=\"font-size:0.78rem; color:#cbd5e1;\">Explore \u00b7 Analyze \u00b7 Compare \u00b7 Investigate</div>\n                  </div>\n                  <div class=\"arch-arrow\">\u25b2 Synchronized by AppStateManager \u25bc</div>\n                  <div class=\"arch-box tier2\">\n                    <strong>Perception & Photogrammetric Engine</strong>\n                    <div style=\"font-size:0.78rem; color:#cbd5e1;\">ResNet-18 \u00b7 Siamese U-Net \u00b7 SIFT/FLANN/RANSAC Stitching Lab</div>\n                  </div>\n                  <div class=\"arch-arrow\">\u25b2 Ingestion & Streaming \u25bc</div>\n                  <div class=\"arch-box tier1\">\n                    <strong>Planetary Computer STAC & Sentinel-2 COG Decimation</strong>\n                    <div style=\"font-size:0.78rem; color:#cbd5e1;\">Zero-download windowed streaming \u00b7 UTM reprojection \u00b7 OSM Nominatim</div>\n                  </div>\n                </div>\n              </div>\n            </div>\n            ", "notes": "Explain how TerraPulse v2.0 consolidated earlier separate tabs into 4 streamlined workspaces connected by AppStateManager. When a user changes location or date, all dependent maps, layers, and AI investigations update synchronously."}, {"id": 5, "title": "Data Ingestion & Integrity Protocols", "subtitle": "Open Cloud Datasets with Methodological Safeguards Against Leakage", "category": "Dataset Methodology", "branch": "Data Ingestion", "content": "\n            <div class=\"two-col\">\n              <div class=\"card\">\n                <h4 style=\"color:#38bdf8; margin:0 0 10px 0;\">Primary Data Sources</h4>\n                <div class=\"metric-card\">\n                  <div class=\"metric-title\">Sentinel-2 L2A Multi-Spectral Surface Reflectance</div>\n                  <div class=\"metric-desc\">Bands B02 (Blue), B03 (Green), B04 (Red), B08 (NIR) at 10m spatial resolution. Streamed on demand from Microsoft Planetary Computer STAC via HTTP range requests.</div>\n                </div>\n                <div class=\"metric-card\">\n                  <div class=\"metric-title\">EuroSAT Land Use & Land Cover Benchmark</div>\n                  <div class=\"metric-desc\">27,000 multi-spectral/RGB tiles across 10 classes. Verified MD5: <code>c8fa014336c82ac7804f0398fcb19387</code>. Stratified 70/15/15 train/val/test split.</div>\n                </div>\n                <div class=\"metric-card\">\n                  <div class=\"metric-title\">LEVIR-CD High-Resolution Building Change Detection</div>\n                  <div class=\"metric-desc\">Bi-temporal pairs (0.5 m/px). Sliced into 256\u00d7256 patches across multi-year temporal intervals.</div>\n                </div>\n              </div>\n              <div class=\"card\">\n                <h4 style=\"color:#ef4444; margin:0 0 8px 0;\">\ud83d\udee1\ufe0f Methodological Integrity: Zero Data Leakage</h4>\n                <div class=\"alert-warning\" style=\"margin-bottom:12px;\">\n                  <strong>Source-Level Scene Partitioning:</strong><br>\n                  LEVIR-CD image pairs were divided into train and test sets <em>prior to 256\u00d7256 patch tiling</em> (52 source scenes for training, 12 separate unseen source scenes for testing).\n                </div>\n                <p style=\"font-size:0.85rem; color:#cbd5e1; line-height:1.45;\">If patches from the same source scene were randomly distributed between train and test splits, spatial autocorrelation would cause severe optimistic evaluation bias. Our protocol guarantees evaluation on entirely unseen terrain.</p>\n                <div class=\"stat-row\" style=\"margin-top:12px;\">\n                  <div class=\"stat-pill\"><span class=\"stat-val\">10</span><span class=\"stat-lbl\">EuroSAT Classes</span></div>\n                  <div class=\"stat-pill\"><span class=\"stat-val\">832 / 192</span><span class=\"stat-lbl\">Train / Test Patches</span></div>\n                  <div class=\"stat-pill\"><span class=\"stat-val\">0%</span><span class=\"stat-lbl\">Scene Leakage</span></div>\n                </div>\n              </div>\n            </div>\n            ", "notes": "Evaluators care deeply about experimental validity. Emphasize that splitting by source scene rather than random tile slicing guarantees that the test set measures true generalizability."}, {"id": 6, "title": "Deep Learning Core Models", "subtitle": "Fine-Tuned ResNet-18 Classifier & Dual-Encoder Siamese U-Net", "category": "Deep Learning", "branch": "DL Architecture", "content": "\n            <div class=\"two-col\">\n              <div class=\"card\">\n                <h4 style=\"color:#10b981; margin:0 0 6px 0;\">ResNet-18 Land-Cover Classifier</h4>\n                <ul class=\"styled-list\" style=\"font-size:0.85rem;\">\n                  <li>Pretrained ImageNet feature weights fine-tuned on EuroSAT Sentinel-2 tiles.</li>\n                  <li>Custom projection head: Flatten \u2794 Dropout(0.2) \u2794 Linear(512, 10).</li>\n                  <li>Cross-Entropy loss with Adam optimizer (lr=1e-3, batch=64).</li>\n                  <li><strong>Validation Accuracy: 96.35% at epoch 10</strong> (target was \u2265 85.0%).</li>\n                </ul>\n                <h4 style=\"color:#38bdf8; margin:14px 0 6px 0;\">Siamese U-Net Change Detector</h4>\n                <ul class=\"styled-list\" style=\"font-size:0.85rem;\">\n                  <li>Two weight-sharing encoder towers processing observation pair $(t_0, t_1)$.</li>\n                  <li>Feature distance extracted at 4 hierarchical depths: <code>|f_i(t\u2080) - f_i(t\u2081)|</code>.</li>\n                  <li>U-Net decoder with residual skip connections restores fine boundary resolution.</li>\n                  <li>Compound Loss: <code>L = BCE + Dice</code> to overcome class imbalance.</li>\n                  <li><strong>Test F1: 0.799, Test IoU: 0.665 at epoch 15</strong> (target was \u2265 0.70).</li>\n                </ul>\n              </div>\n              <div class=\"card\" style=\"display:flex; flex-direction:column; justify-content:center; align-items:center;\">\n                <h4 style=\"color:#a855f7; margin:0 0 8px 0; align-self:flex-start;\">Siamese Weight-Sharing Dataflow</h4>\n                <svg viewBox=\"0 0 440 280\" style=\"width:100%; max-width:420px; background:rgba(15,23,42,0.6); border-radius:10px; border:1px solid rgba(255,255,255,0.1);\">\n                  <rect x=\"20\" y=\"25\" width=\"80\" height=\"35\" rx=\"6\" fill=\"#1e293b\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n                  <text x=\"60\" y=\"47\" fill=\"#e2e8f0\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">Image t\u2080</text>\n                  <rect x=\"20\" y=\"215\" width=\"80\" height=\"35\" rx=\"6\" fill=\"#1e293b\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n                  <text x=\"60\" y=\"237\" fill=\"#e2e8f0\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">Image t\u2081</text>\n                  <rect x=\"135\" y=\"15\" width=\"75\" height=\"55\" rx=\"6\" fill=\"#0f172a\" stroke=\"#10b981\" stroke-width=\"1.5\"/>\n                  <text x=\"172\" y=\"42\" fill=\"#10b981\" font-size=\"10\" font-weight=\"bold\" text-anchor=\"middle\">Encoder</text>\n                  <text x=\"172\" y=\"58\" fill=\"#94a3b8\" font-size=\"8\" text-anchor=\"middle\">4 Scales</text>\n                  <rect x=\"135\" y=\"205\" width=\"75\" height=\"55\" rx=\"6\" fill=\"#0f172a\" stroke=\"#10b981\" stroke-width=\"1.5\"/>\n                  <text x=\"172\" y=\"232\" fill=\"#10b981\" font-size=\"10\" font-weight=\"bold\" text-anchor=\"middle\">Encoder</text>\n                  <text x=\"172\" y=\"248\" fill=\"#94a3b8\" font-size=\"8\" text-anchor=\"middle\">Shared Wts</text>\n                  <line x1=\"100\" y1=\"42\" x2=\"135\" y2=\"42\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n                  <line x1=\"100\" y1=\"232\" x2=\"135\" y2=\"232\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n                  <line x1=\"172\" y1=\"70\" x2=\"172\" y2=\"205\" stroke=\"#f59e0b\" stroke-width=\"1.5\" stroke-dasharray=\"4,4\"/>\n                  <text x=\"180\" y=\"140\" fill=\"#f59e0b\" font-size=\"9\" transform=\"rotate(-90 180,140)\">Shared Weights</text>\n                  <rect x=\"240\" y=\"105\" width=\"75\" height=\"65\" rx=\"6\" fill=\"#312e81\" stroke=\"#818cf8\" stroke-width=\"1.5\"/>\n                  <text x=\"277\" y=\"130\" fill=\"#c7d2fe\" font-size=\"10\" font-weight=\"bold\" text-anchor=\"middle\">|f(t\u2080)-f(t\u2081)|</text>\n                  <text x=\"277\" y=\"148\" fill=\"#94a3b8\" font-size=\"8\" text-anchor=\"middle\">Multi-Scale</text>\n                  <text x=\"277\" y=\"160\" fill=\"#94a3b8\" font-size=\"8\" text-anchor=\"middle\">Diff Fusion</text>\n                  <path d=\"M 210 42 L 240 120\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n                  <path d=\"M 210 232 L 240 150\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n                  <rect x=\"340\" y=\"110\" width=\"80\" height=\"55\" rx=\"6\" fill=\"#1e1b4b\" stroke=\"#ec4899\" stroke-width=\"1.5\"/>\n                  <text x=\"380\" y=\"135\" fill=\"#f472b6\" font-size=\"10\" font-weight=\"bold\" text-anchor=\"middle\">U-Net Dec</text>\n                  <text x=\"380\" y=\"152\" fill=\"#94a3b8\" font-size=\"8\" text-anchor=\"middle\">BCE + Dice</text>\n                  <line x1=\"315\" y1=\"137\" x2=\"340\" y2=\"137\" stroke=\"#ec4899\" stroke-width=\"2\"/>\n                  <text x=\"380\" y=\"195\" fill=\"#34d399\" font-size=\"10\" font-weight=\"bold\" text-anchor=\"middle\">Change Mask</text>\n                </svg>\n              </div>\n            </div>\n            ", "notes": "Walk through the Siamese mathematical formulation. Shared weights guarantee that the network treats t0 and t1 with exact symmetry, while multi-scale difference captures both minute structures and large parcels."}, {"id": 7, "title": "Empirical Training Results", "subtitle": "Actual Convergence Metrics Sourced from Committed Checkpoint Logs", "category": "Experimental Validation", "branch": "Checkpoint Logs", "content": "\n            <div class=\"two-col\">\n              <div>\n                <div class=\"card\">\n                  <h4 style=\"margin:0 0 6px 0; color:#38bdf8;\">EuroSAT Classifier (ResNet-18)</h4>\n                  \n    <svg viewBox=\"0 0 540 230\" class=\"chart-svg\" style=\"width:100%; height:auto; background:rgba(15,23,42,0.6); border-radius:12px; border:1px solid rgba(255,255,255,0.1);\">\n      <line x1=\"40\" y1=\"190.0\" x2=\"500\" y2=\"190.0\" stroke=\"rgba(255,255,255,0.08)\" stroke-dasharray=\"3,3\" /><text x=\"32\" y=\"194.0\" font-size=\"10\" fill=\"#94a3b8\" text-anchor=\"end\" font-family=\"monospace\">80%</text><line x1=\"40\" y1=\"152.5\" x2=\"500\" y2=\"152.5\" stroke=\"rgba(255,255,255,0.08)\" stroke-dasharray=\"3,3\" /><text x=\"32\" y=\"156.5\" font-size=\"10\" fill=\"#94a3b8\" text-anchor=\"end\" font-family=\"monospace\">85%</text><line x1=\"40\" y1=\"115.0\" x2=\"500\" y2=\"115.0\" stroke=\"rgba(255,255,255,0.08)\" stroke-dasharray=\"3,3\" /><text x=\"32\" y=\"119.0\" font-size=\"10\" fill=\"#94a3b8\" text-anchor=\"end\" font-family=\"monospace\">90%</text><line x1=\"40\" y1=\"77.5\" x2=\"500\" y2=\"77.5\" stroke=\"rgba(255,255,255,0.08)\" stroke-dasharray=\"3,3\" /><text x=\"32\" y=\"81.5\" font-size=\"10\" fill=\"#94a3b8\" text-anchor=\"end\" font-family=\"monospace\">95%</text><line x1=\"40\" y1=\"40.0\" x2=\"500\" y2=\"40.0\" stroke=\"rgba(255,255,255,0.08)\" stroke-dasharray=\"3,3\" /><text x=\"32\" y=\"44.0\" font-size=\"10\" fill=\"#94a3b8\" text-anchor=\"end\" font-family=\"monospace\">100%</text>\n      <path d=\"M 40.0,146.6 L 72.9,112.7 L 105.7,99.4 L 138.6,93.2 L 171.4,87.6 L 204.3,85.3 L 237.1,81.6 L 270.0,80.5 L 302.9,76.8 L 335.7,75.8 L 368.6,74.6 L 401.4,74.0 L 434.3,75.4 L 467.1,72.5 L 500.0,69.0\" fill=\"none\" stroke=\"#38bdf8\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" /><path d=\"M 40.0,105.9 L 72.9,112.0 L 105.7,110.9 L 138.6,80.4 L 171.4,134.8 L 204.3,77.8 L 237.1,113.9 L 270.0,79.6 L 302.9,87.2 L 335.7,67.4 L 368.6,141.3 L 401.4,71.9 L 434.3,74.8 L 467.1,71.5 L 500.0,74.1\" fill=\"none\" stroke=\"#10b981\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" />\n      <circle cx=\"40.0\" cy=\"146.6\" r=\"3.5\" fill=\"#38bdf8\" stroke=\"#0f172a\" stroke-width=\"1.5\"><title>Epoch 1: 0.858</title></circle><circle cx=\"138.6\" cy=\"93.2\" r=\"3.5\" fill=\"#38bdf8\" stroke=\"#0f172a\" stroke-width=\"1.5\"><title>Epoch 4: 0.929</title></circle><circle cx=\"237.1\" cy=\"81.6\" r=\"3.5\" fill=\"#38bdf8\" stroke=\"#0f172a\" stroke-width=\"1.5\"><title>Epoch 7: 0.944</title></circle><circle cx=\"335.7\" cy=\"75.8\" r=\"3.5\" fill=\"#38bdf8\" stroke=\"#0f172a\" stroke-width=\"1.5\"><title>Epoch 10: 0.952</title></circle><circle cx=\"434.3\" cy=\"75.4\" r=\"3.5\" fill=\"#38bdf8\" stroke=\"#0f172a\" stroke-width=\"1.5\"><title>Epoch 13: 0.953</title></circle><circle cx=\"500.0\" cy=\"69.0\" r=\"3.5\" fill=\"#38bdf8\" stroke=\"#0f172a\" stroke-width=\"1.5\"><title>Epoch 15: 0.961</title></circle><circle cx=\"40.0\" cy=\"105.9\" r=\"3.5\" fill=\"#10b981\" stroke=\"#0f172a\" stroke-width=\"1.5\"><title>Epoch 1: 0.912</title></circle><circle cx=\"138.6\" cy=\"80.4\" r=\"3.5\" fill=\"#10b981\" stroke=\"#0f172a\" stroke-width=\"1.5\"><title>Epoch 4: 0.946</title></circle><circle cx=\"237.1\" cy=\"113.9\" r=\"3.5\" fill=\"#10b981\" stroke=\"#0f172a\" stroke-width=\"1.5\"><title>Epoch 7: 0.901</title></circl
