 22: 0.482</title></circle><circle cx=\"500.0\" cy=\"89.8\" r=\"3.5\" fill=\"#f59e0b\" stroke=\"#0f172a\" stroke-width=\"1.5\"><title>Epoch 25: 0.601</title></circle>\n      <rect x=\"50\" y=\"12\" width=\"12\" height=\"4\" rx=\"2\" fill=\"#a855f7\" /><text x=\"66\" y=\"17\" font-size=\"11\" fill=\"#e2e8f0\" font-weight=\"600\">Train F1</text><rect x=\"150\" y=\"12\" width=\"12\" height=\"4\" rx=\"2\" fill=\"#ec4899\" /><text x=\"166\" y=\"17\" font-size=\"11\" fill=\"#e2e8f0\" font-weight=\"600\">Test F1 (Best: 0.799)</text><rect x=\"354\" y=\"12\" width=\"12\" height=\"4\" rx=\"2\" fill=\"#f59e0b\" /><text x=\"370\" y=\"17\" font-size=\"11\" fill=\"#e2e8f0\" font-weight=\"600\">Test IoU (0.665)</text>\n    </svg>\n    \n                  <div style=\"font-size:0.78rem; color:#94a3b8; margin-top:6px;\">\n                    Peak test metrics: <strong>F1 = 0.799, IoU = 0.665 at epoch 15</strong>. Massive improvement over pixel-diff baseline.\n                  </div>\n                </div>\n              </div>\n            </div>\n            <div class=\"card\" style=\"margin-top:10px; background:rgba(30,41,59,0.5); padding:10px 16px;\">\n              <div style=\"display:flex; justify-content:space-around; text-align:center;\">\n                <div><span style=\"color:#94a3b8; font-size:0.75rem;\">Classical Pixel-Diff Baseline</span><br><strong style=\"font-size:1.0rem; color:#ef4444;\">F1: 0.164 | IoU: 0.089</strong></div>\n                <div><span style=\"color:#94a3b8; font-size:0.75rem;\">Siamese U-Net (Ours)</span><br><strong style=\"font-size:1.0rem; color:#10b981;\">F1: 0.799 | IoU: 0.665</strong></div>\n                <div><span style=\"color:#94a3b8; font-size:0.75rem;\">Relative F1 Gain</span><br><strong style=\"font-size:1.0rem; color:#38bdf8;\">+387.2% Improvement</strong></div>\n              </div>\n            </div>\n            ", "notes": "These numbers are not estimates\u2014they are exact values extracted from checkpoints/classify_training_log.csv and checkpoints/change_training_log.csv."}, {"id": 8, "title": "Workspace 1: \ud83c\udf0d Explore & Discover", "subtitle": "Global Search, 3D Orbital Globe & Automated 4-Quadrant Mosaicking", "category": "Workspace 1", "branch": "workspace_explore.py", "content": "\n            <div class=\"two-col\">\n              <div class=\"card\">\n                <h4 style=\"color:#38bdf8; margin:0 0 8px 0;\">Global Ingestion Engine</h4>\n                <ul class=\"styled-list\" style=\"font-size:0.85rem;\">\n                  <li><strong>Universal Geocoding:</strong> OpenStreetMap Nominatim integration supporting free-text query or 7 pre-warmed global megacities (Bengaluru, Tokyo Bay, Cairo, Swiss Alps, Grand Canyon, Paris, Dubai).</li>\n                  <li><strong>3D Orbital Globe:</strong> Deck.gl / Pydeck integration clamping georeferenced square mosaics onto an interactive 3D Earth sphere with orbital physics.</li>\n                  <li><strong>Multi-Epoch STAC Archive:</strong> Real-time querying of Microsoft Planetary Computer STAC from 2016 to 2025.</li>\n                </ul>\n                <div class=\"alert-success\" style=\"margin-top:10px; font-size:0.82rem;\">\n                  <strong>Automated 2\u00d72 Quadrant Detection:</strong> Identifies Northwest, Northeast, Southwest, and Southeast tiles across scene boundaries automatically.\n                </div>\n              </div>\n              <div class=\"card\">\n                <h4 style=\"color:#10b981; margin:0 0 8px 0;\">Cross-UTM Reprojection & Mosaic</h4>\n                <p style=\"font-size:0.84rem; color:#cbd5e1; line-height:1.45;\">\n                  Adjacent satellite scenes frequently span different UTM zones. Workspace 1 dynamically detects UTM boundaries and invokes <code>rasterio.warp.calculate_default_transform</code> to reproject all 4 quadrants into a shared coordinate reference system before fusing them via <code>rasterio.merge</code>.\n                </p>\n                <div class=\"metric-card\" style=\"margin-top:10px;\">\n                  <div class=\"metric-title\">Zero Local Storage Footprint</div>\n                  <div class=\"metric-desc\">Cloud-Optimized GeoTIFFs (COGs) stream overview bands directly into NumPy memory with on-the-fly decimation.</div>\n                </div>\n              </div>\n            </div>\n            ", "notes": "Demonstrate how the automated 4-tile quadrant detection removes manual effort\u2014evaluators can pick any coordinate on Earth, and TerraPulse handles the discovery, coordinate conversion, and stitching automatically."}, {"id": 9, "title": "Workspace 2: \ud83c\udf3f Analyze (Environmental CV)", "subtitle": "6 Calibrated Biophysical Layers with Dynamic 0\u2013100% Opacity Overlay", "category": "Workspace 2", "branch": "workspace_analyze.py", "content": "\n            <div class=\"grid-3\" style=\"gap:12px; margin-bottom:12px;\">\n              <div class=\"card feature-card\">\n                <strong style=\"color:#34d399; font-size:0.85rem;\">\ud83c\udf3f 1. Vegetation Index (NDVI)</strong>\n                <p style=\"font-size:0.75rem; color:#cbd5e1; margin-top:4px;\">(B08-B04)/(B08+B04). Distinguishes healthy photosynthetic canopy from soil and urban concrete.</p>\n              </div>\n              <div class=\"card feature-card\">\n                <strong style=\"color:#60a5fa; font-size:0.85rem;\">\ud83d\udca7 2. Water Extent (NDWI)</strong>\n                <p style=\"font-size:0.75rem; color:#cbd5e1; margin-top:4px;\">(B03-B08)/(B03+B08). McFeeters formulation mapping open reservoirs, lakes, and drainage channels.</p>\n              </div>\n              <div class=\"card feature-card\">\n                <strong style=\"color:#f87171; font-size:0.85rem;\">\ud83d\udd34 3. False-Color (CIR)</strong>\n                <p style=\"font-size:0.75rem; color:#cbd5e1; margin-top:4px;\">NIR-Red-Green composite highlighting vegetation cellular structure in high-contrast red.</p>\n              </div>\n              <div class=\"card feature-card\">\n                <strong style=\"color:#fbbf24; font-size:0.85rem;\">\ud83c\udfd9\ufe0f 4. Built-Up Index (NDBI)</strong>\n                <p style=\"font-size:0.75rem; color:#cbd5e1; margin-top:4px;\">Spectral difference highlighting urban development, asphalt corridors, and construction.</p>\n              </div>\n              <div class=\"card feature-card\">\n                <strong style=\"color:#c084fc; font-size:0.85rem;\">\ud83d\uddfa\ufe0f 5. Land Cover (5-Class)</strong>\n                <p style=\"font-size:0.75rem; color:#cbd5e1; margin-top:4px;\">Deterministic classification: Water, Dense Canopy, Moderate Veg, Built-Up, Bare Soil.</p>\n              </div>\n              <div class=\"card feature-card\">\n                <strong style=\"color:#38bdf8; font-size:0.85rem;\">\ud83d\udc65 6. Population Proxy</strong>\n                <p style=\"font-size:0.75rem; color:#cbd5e1; margin-top:4px;\">Gridded density model mapping settlement clusters over structural impervious surfaces.</p>\n              </div>\n            </div>\n            <div class=\"card\" style=\"background:rgba(15,23,42,0.8);\">\n              <h4 style=\"color:#38bdf8; margin:0 0 6px 0; font-size:0.9rem;\">Interactive 0\u2013100% Opacity Overlay & Metric Calibration</h4>\n              <p style=\"font-size:0.82rem; color:#cbd5e1; margin:0; line-height:1.4;\">\n                Allows blending spectral heatmap layers seamlessly onto true-color satellite imagery. Every layer outputs calibrated physical area in <strong>square kilometers (km\u00b2)</strong>, percentage distribution, and pixel histograms.\n              </p>\n            </div>\n            ", "notes": "Highlight the engineering utility of the 0\u2013100% opacity slider. Rather than viewing an isolated false-color mask, evaluators see exactly which city blocks or lakes correspond to the spectral anomalies."}, {"id": 10, "title": "Workspace 3: \u2194\ufe0f Compare (Bi-Temporal Change)", "subtitle": "Common Grid Harmonization & Interactive Split Swipe Comparison", "category": "Workspace 3", "branch": "workspace_compare.py", "content": "\n            <div class=\"two-col\">\n              <div class=\"card\">\n                <h4 style=\"color:#38bdf8; margin:0 0 8px 0;\">Conditional Multi-Epoch Alignment</h4>\n                <ul class=\"styled-list\" style=\"font-size:0.85rem;\">\n                  <li><strong>Conditional UI Activation:</strong> Only enables when two valid temporal observations exist; provides informative status when secondary imagery is pending.</li>\n                  <li><strong>Spatial Harmonization:</strong> Warps baseline $(t_0)$ and current $(t_1)$ observations onto an identical pixel coordinate grid and bounding box.</li>\n                  <li><strong>Strict Provenance Metadata:</strong> Displays acquisition dates, satellite platform IDs, cloud percentages, and spatial overlap ratio.</li>\n                </ul>\n                <div class=\"metric-card\" style=\"margin-top:10px;\">\n                  <div class=\"metric-title\">\u0394NDVI Vegetation Gain & Depletion Map</div>\n                  <div class=\"metric-desc\">Computes <code>\u0394NDVI = NDVI(t\u2081) - NDVI(t\u2080)</code> to highlight afforestation (+green) vs canopy depletion (-red).</div>\n                </div>\n              </div>\n              <div class=\"card\" style=\"display:flex; flex-direction:column; justify-content:center; align-items:center;\">\n                <h4 style=\"color:#10b981; margin:0 0 8px 0; align-self:flex-start;\">Split Swipe Comparison Visual</h4>\n                <div style=\"width:100%; height:180px; background:#020617; border-radius:8px; border:1px solid #334155; position:relative; overflow:hidden; display:flex;\">\n                  <div style=\"width:50%; height:100%; background:linear-gradient(135deg, #064e3b, #0f172a); display:flex; align-items:center; justify-content:center; color:#34d399; font-weight:bold; font-size:0.85rem;\">\n                    Baseline (t\u2080: 2020)\n                  </div>\n                  <div style=\"width:2px; height:100%; background:#00f0ff; position:relative; z-index:10;\">\n                    <div style=\"width:22px; height:22px; border-radius:50%; background:#0b0f19; border:2px solid #00f0ff; position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); display:flex; align-items:center; justify-content:center; font-size:10px; color:#00f0ff;\">\u2194</div>\n                  </div>\n                  <div style=\"width:50%; height:100%; background:linear-gradient(135deg, #451a03, #0f172a); display:flex; align-items:center; justify-content:center; color:#fbbf24; font-weight:bold; font-size:0.85rem;\">\n                    Current (t\u2081: 2024)\n                  </div>\n                </div>\n                <div style=\"font-size:0.75rem; color:#94a3b8; text-align:center; margin-top:8px;\">Interactive swipe slider dynamically compares before/after scenes with common spatial boundary</div>\n              </div>\n            </div>\n            ", "notes": "Point out that the comparison workspace prevents false comparisons by enforcing exact spatial alignment and reporting the overlap percentage before running change detection."}, {"id": 11, "title": "Workspace 4: \ud83e\udde0 Investigate (AI Evidence Synthesis)", "subtitle": "8-Agent Swarm Grounded in Empirical Sensor Data & Peer-Reviewed Literature", "category": "Workspace 4", "branch": "workspace_investigate.py", "content": "\n            <div class=\"two-col\">\n              <div class=\"card\">\n                <h4 style=\"color:#a855f7; margin:0 0 8px 0;\">The 8-Agent Synthesis Swarm</h4>\n                <div class=\"grid-2\" style=\"display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:0.75rem;\">\n                  <div class=\"metric-card\" style=\"margin:0; padding:8px;\">\ud83d\udef0\ufe0f Satellite Analysis</div>\n                  <div class=\"metric-card\" style=\"margin:0; padding:8px;\">\ud83d\udcda Academic Research</div>\n                  <div class=\"metric-card\" style=\"margin:0; padding:8px;\">\ud83c\udfdb\ufe0f Policy & BDA Plans</div>\n                  <div class=\"metric-card\" style=\"margin:0; padding:8px;\">\ud83d\udcf0 News & Media Archives</div>\n                  <div class=\"metric-card\" style=\"margin:0; padding:8px;\">\ud83d\udc65 Census Demographics</div>\n                  <div class=\"metric-card\" style=\"margin:0; padding:8px;\">\ud83d\ude87 Infrastructure Corridors</div>\n                  <div class=\"metric-card\" style=\"margin:0; padding:8px;\">\ud83c\udf0a Lake Ecology Surveys</div>\n                  <div class=\"metric-card\" style=\"margin:0; padding:8px;\">\u2696\ufe0f Cross-Verification</div>\n                </div>\n                <div class=\"alert-success\" style=\"margin-top:10px; font-size:0.8rem;\">\n                  <strong>Empirical Grounding:</strong> Ingests measured km\u00b2 land-cover transformations from Workspace 2 rather than guessing causality from raw images.\n                </div>\n              </div>\n              <div class=\"card\">\n                <h4 style=\"color:#38bdf8; margin:0 0 8px 0;\">Strict Evidence Categorization</h4>\n                <ul class=\"styled-list\" style=\"font-size:0.8rem;\">\n                  <li><strong style=\"color:#38bdf8;\">[OBSERVED]:</strong> Directly measured by optical sensors (e.g. built-up density rising from 21.8% to 74.2%).</li>\n                  <li><strong style=\"color:#34d399;\">[DOCUMENTED]:</strong> Verified in government census / peer-reviewed literature (e.g. population tripling to 13.5M).</li>\n                  <li><strong style=\"color:#fbbf24;\">[CORRELATED]:</strong> Spatial overlap between stormwater encroachment and IT corridors.</li>\n                  <li><strong style=\"color:#c084fc;\">[POSSIBLE EXPLANATION]:</strong> Planning projections (BDA Master Plan 2031).</li>\n                </ul>\n                <div style=\"font-size:0.78rem; color:#94a3b8; margin-top:6px;\">\n                  Includes interactive Causal Reasoning Graph citing IISc CES studies and KSRSAC Wetland Atlases.\n                </div>\n              </div>\n            </div>\n            ", "notes": "This is a major differentiator. The AI investigator does not hallucinate causal claims; it explicitly tags what was measured by satellite versus what was recorded in government archives."}, {"id": 12, "title": "Advanced Diagnostics: \ud83d\udd2c SIFT Stitching Lab", "subtitle": "Multi-Seam Landmark Reference Lines & Photogrammetric Verification", "category": "Diagnostics Drawer", "branch": "workspace_advanced.py", "content": "\n            <div class=\"two-col\">\n              <div class=\"card\">\n                <h4 style=\"color:#38bdf8; margin:0 0 8px 0;\">Multi-Seam Landmark Lines Canvas</h4>\n                <p style=\"font-size:0.84rem; color:#cbd5e1; line-height:1.45;\">\n                  Verifies geometric seamlessness by projecting continuous emerald horizontal and cyan vertical landmark reference lines across quadrant seams. Evaluators can visually confirm zero shear distortion across tile boundaries.\n                </p>\n                <div class=\"stat-row\" style=\"margin-top:12px;\">\n                  <div class=\"stat-pill\"><span class=\"stat-val\">89.4%</span><span class=\"stat-lbl\">RANSAC Inlier Ratio</span></div>\n                  <div class=\"stat-pill\"><span class=\"stat-val\">&lt; 5.0 px</span><span class=\"stat-lbl\">Reprojection Tolerance</span></div>\n                  <div class=\"stat-pill\"><span class=\"stat-val\">3\u00d73</span><span class=\"stat-lbl\">Homography Matrix</span></div>\n                </div>\n              </div>\n              <div class=\"card\">\n                <h4 style=\"color:#10b981; margin:0 0 8px 0;\">Algorithmic Photogrammetry Pipeline</h4>\n                <ol class=\"styled-list\" style=\"font-size:0.82rem;\">\n                  <li><strong>SIFT Detection:</strong> Difference-of-Gaussians scale-space extrema with 128-dim orientation descriptors.</li>\n                  <li><strong>FLANN Matching:</strong> 5 randomized KD-Trees finding approximate nearest neighbors.</li>\n                  <li><strong>Lowe's Ratio Test:</strong> Prunes matches with distance ratio d\u2081/d\u2082 \u2265 0.75.</li>\n                  <li><strong>RANSAC Homography:</strong> Iterative outlier rejection calculating optimal 3\u00d73 perspective warp.</li>\n                  <li><strong>Diagnostic Views:</strong> Overlap alpha-blend slider and alternating checkerboard split view.</li>\n                </ol>\n              </div>\n            </div>\n            ", "notes": "Walk through the photogrammetric diagnostics. The landmark reference lines prove to evaluators that geometric rectification succeeds across seams without distorting roads or terrain."}, {"id": 13, "title": "Central State Management & Provenance", "subtitle": "AppStateManager: Reactive Single Source of Truth & Guided Workflow", "category": "Software Architecture", "branch": "state_manager.py", "content": "\n            <div class=\"two-col\">\n              <div class=\"card\">\n                <h4 style=\"color:#38bdf8; margin:0 0 8px 0;\">AppStateManager Invalidation Logic</h4>\n                <p style=\"font-size:0.84rem; color:#cbd5e1; line-height:1.45;\">\n                  Eliminates fragmented state bugs. When a user switches location or observation date, downstream caches are systematically invalidated:\n                </p>\n                <div class=\"code-block\" style=\"font-size:0.75rem; margin-top:8px;\">\n                  Location Change \u2794 Clear Scenes, Mosaics, Layers, Comparisons<br>\n                  Observation Switch \u2794 Clear Dependent Environmental Layers<br>\n                  Preserves Cache \u2794 Re-visiting identical Observation ID\n                </div>\n                <div class=\"alert-success\" style=\"margin-top:10px; font-size:0.8rem;\">\n                  <strong>Tested & Verified:</strong> 100% passing tests in <code>tests/test_state_manager.py</code>.\n                </div>\n              </div>\n              <div class=\"card\">\n                <h4 style=\"color:#10b981; margin:0 0 8px 0;\">Live 6-Step Guided Workflow Indicator</h4>\n                <div class=\"styled-list\" style=\"font-size:0.82rem;\">\n                  <li><strong>Step 1: Location</strong> \u2014 Geocoded coordinates & target UTM zone</li>\n                  <li><strong>Step 2: Imagery</strong> \u2014 Sentinel-2 scene discovery from STAC</li>\n                  <li><strong>Step 3: Map</strong> \u2014 Automated 4-quadrant mosaic generation</li>\n                  <li><strong>Step 4: Environmental Layers</strong> \u2014 6 biophysical layers calibrated</li>\n                  <li><strong>Step 5: Compare Dates</strong> \u2014 Multi-epoch grid alignment</li>\n                  <li><strong>Step 6: Investigate</strong> \u2014 Multi-agent evidence synthesis ready</li>\n                </div>\n                <div style=\"font-size:0.75rem; color:#94a3b8; margin-top:6px;\">Contextual badges indicate exact step completion status in real time</div>\n              </div>\n            </div>\n            ", "notes": "Explain how this architectural redesign solved a major user experience hurdle. Previously, changing a location could leave stale maps in other tabs. Now, AppStateManager guarantees 100% cache consistency."}, {"id": 14, "title": "Comprehensive Technology Stack", "subtitle": "Scientific Computing, Deep Learning & Remote Sensing Frameworks", "category": "Tech Stack", "branch": "Tech Matrix", "content": "\n            <div class=\"grid-3\">\n              <div class=\"card\">\n                <h4 style=\"color:#38bdf8; margin:0 0 8px 0;\">\ud83e\udde0 Deep Learning</h4>\n                <ul class=\"styled-list\" style=\"font-size:0.82rem;\">\n                  <li><strong>PyTorch 2.4.1</strong> \u2014 Tensor engine with Apple Silicon MPS & CUDA acceleration</li>\n                  <li><strong>torchvision 0.19.1</strong> \u2014 ResNet-18 pretrained feature weights</li>\n                  <li><strong>segmentation-models</strong> \u2014 U-Net & DeepLabV3+ architectures</li>\n                  <li><strong>timm & transformers</strong> \u2014 NASA Prithvi-EO ViT support</li>\n                </ul>\n              </div>\n              <div class=\"card\">\n                <h4 style=\"color:#10b981; margin:0 0 8px 0;\">\ud83d\udef0\ufe0f Geospatial & CV</h4>\n                <ul class=\"styled-list\" style=\"font-size:0.82rem;\">\n                  <li><strong>OpenCV 4.10</strong> \u2014 SIFT keypoints, FLANN matcher, warpPerspective</li>\n                  <li><strong>rasterio 1.3</strong> \u2014 COG window decimation, UTM reprojection, merge</li>\n                  <li><strong>pystac-client</strong> \u2014 SpatioTemporal Asset Catalog queries</li>\n                  <li><strong>pydeck & Deck.gl</strong> \u2014 Clamped 3D orbital globe rendering</li>\n                </ul>\n              </div>\n              <div class=\"card\">\n                <h4 style=\"color:#ec4899; margin:0 0 8px 0;\">\ud83d\udcbb UI & Testing</h4>\n                <ul class=\"styled-list\" style=\"font-size:0.82rem;\">\n                  <li><strong>Streamlit 1.38.0</strong> \u2014 4-workspace reactive web platform</li>\n                  <li><strong>FastAPI</strong> \u2014 Backend microservices for investigator & telemetry</li>\n                  <li><strong>pytest 8.3.3</strong> \u2014 State manager & stitching test suites</li>\n                  <li><strong>OSM Nominatim</strong> \u2014 Free global geocoding API</li>\n                </ul>\n              </div>\n            </div>\n            <div class=\"card\" style=\"margin-top:12px; background:rgba(30,41,59,0.5); display:flex; justify-content:space-between; align-items:center;\">\n              <span style=\"font-size:0.85rem;\"><strong>Reproducibility:</strong> Pinned dependencies in <code>requirements.txt</code> with zero paid API keys.</span>\n              <span class=\"badge badge-emerald\">MPS & CPU Optimized</span>\n            </div>\n            ", "notes": "All components run locally. No proprietary SaaS tools or expensive cloud instances are required to reproduce the full pipeline."}, {"id": 15, "title": "Empirical Benchmark Scorecard", "subtitle": "Rigorous Subsystem Verification Across Computer Vision & System Modules", "category": "Evaluation", "branch": "Benchmark Matrix", "content": "\n            <div class=\"table-container\">\n              <table class=\"styled-table\">\n                <thead>\n                  <tr>\n                    <th>Subsystem</th>\n                    <th>Evaluation Dataset</th>\n                    <th>Metric</th>\n                    <th>Target</th>\n                    <th>Achieved</th>\n                    <th>Status</th>\n                  </tr>\n                </thead>\n                <tbody>\n                  <tr>\n                    <td><strong>Classifier</strong></td>\n                    <td>EuroSAT (27k tiles, 10 classes)</td>\n                    <td>Top-1 Validation Accuracy</td>\n                    <td>\u2265 85.0%</td>\n                    <td><strong style=\"color:#34d399;\">96.35%</strong> (Epoch 10)</td>\n                    <td><span class=\"badge badge-emerald\">\u2705 +11.35% Margin</span></td>\n                  </tr>\n                  <tr>\n                    <td><strong>Pixel Baseline</strong></td>\n                    <td>LEVIR-CD (Unsupervised Diff)</td>\n                    <td>Test F1 / IoU</td>\n                    <td>Baseline Reference</td>\n                    <td>F1 = 0.164, IoU = 0.089</td>\n                    <td><span class=\"badge badge-sky\">Base</span></td>\n                  </tr>\n                  <tr>\n                    <td><strong>Siamese U-Net</strong></td>\n                    <td>LEVIR-CD (832 train / 192 test)</td>\n                    <td>Test F1 Score</td>\n                    <td>\u2265 0.700</td>\n                    <td><strong style=\"color:#34d399;\">0.799</strong> (Epoch 15)</td>\n                    <td><span class=\"badge badge-emerald\">\u2705 +14.1% Margin</span></td>\n                  </tr>\n                  <tr>\n                    <td><strong>Siamese U-Net</strong></td>\n                    <td>LEVIR-CD (832 train / 192 test)</td>\n                    <td>Intersection over Union (IoU)</td>\n                    <td>\u2265 0.500</td>\n                    <td><strong style=\"color:#34d399;\">0.665</strong> (Epoch 15)</td>\n                    <td><span class=\"badge badge-emerald\">\u2705 +33.0% Margin</span></td>\n                  </tr>\n                  <tr>\n                    <td><strong>Tile Stitcher</strong></td>\n                    <td>Overlapping Synthetic Satellite Tiles</td>\n                    <td>RANSAC Inlier Ratio</td>\n                    <td>\u2265 25.0%</td>\n                    <td><strong style=\"color:#34d399;\">89.4% Inliers</strong></td>\n                    <td><span class=\"badge badge-emerald\">\u2705 +257.6% Margin</span></td>\n                  </tr>\n                  <tr>\n                    <td><strong>State Manager</strong></td>\n                    <td><code>tests/test_state_manager.py</code></td>\n                    <td>Cache Invalidation Verification</td>\n                    <td>100% Pass</td>\n                    <td><strong style=\"color:#34d399;\">All Tests Passing</strong></td>\n                    <td><span class=\"badge badge-emerald\">\u2705 Verified</span></td>\n                  </tr>\n                </tbody>\n              </table>\n            </div>\n            ", "notes": "Reiterate that all numbers reflect committed results. The Siamese U-Net achieves an F1 of 0.799 on unseen test scenes, representing a ~387% improvement over the baseline."}, {"id": 16, "title": "End-to-End Operational Pipeline", "subtitle": "Complete Workflow from Orbit to Evidence-Based Environmental Intelligence", "category": "Operational Workflow", "branch": "Pipeline Flow", "content": "\n            <div class=\"pipeline-flow\">\n              <div class=\"pipe-step\">\n                <div class=\"pipe-header\">1. Location</div>\n                <div class=\"pipe-body\">Nominatim geocode \u2794 Bounding Box \u2794 Optimal UTM</div>\n              </div>\n              <div class=\"pipe-arrow\">\u2794</div>\n              <div class=\"pipe-step\">\n                <div class=\"pipe-header\">2. Stream</div>\n                <div class=\"pipe-body\">Planetary Computer STAC \u2794 Decimated COG range stream</div>\n              </div>\n              <div class=\"pipe-arrow\">\u2794</div>\n              <div class=\"pipe-step\">\n                <div class=\"pipe-header\">3. Stitch</div>\n                <div class=\"pipe-body\">Auto 4-quadrant detection \u2794 UTM warp \u2794 Seamless mosaic</div>\n              </div>\n              <div class=\"pipe-arrow\">\u2794</div>\n              <div class=\"pipe-step\">\n                <div class=\"pipe-header\">4. Calibrate</div>\n                <div class=\"pipe-body\">NDVI, CIR, NDWI, NDBI \u2794 Land cover \u2794 Area in km\u00b2</div>\n              </div>\n              <div class=\"pipe-arrow\">\u2794</div>\n              <div class=\"pipe-step\">\n                <div class=\"pipe-header\">5. Compare</div>\n                <div class=\"pipe-body\">Common grid alignment \u2794 Split swipe slider \u2794 \u0394NDVI</div>\n              </div>\n              <div class=\"pipe-arrow\">\u2794</div>\n              <div class=\"pipe-step\">\n                <div class=\"pipe-header\">6. Reason</div>\n                <div class=\"pipe-body\">8-agent swarm \u2794 Causal graph \u2794 IISc citations</div>\n              </div>\n            </div>\n            <div class=\"card\" style=\"margin-top:16px;\">\n              <h4 style=\"color:#a855f7; margin:0 0 6px 0; font-size:0.9rem;\">Architectural Consistency Highlights</h4>\n              <div class=\"two-col\" style=\"font-size:0.82rem; color:#cbd5e1; line-height:1.45;\">\n                <div>\n                  \u2022 <strong>Single State Coordination:</strong> <code>AppStateManager</code> guarantees all workspaces reference the same sensor acquisition dates.<br>\n                  \u2022 <strong>Memory Efficiency:</strong> Streams Cloud-Optimized GeoTIFFs directly into NumPy memory without local disk bloat.\n                </div>\n                <div>\n                  \u2022 <strong>Graceful Degradation:</strong> Automated fallbacks ensure smooth offline demonstration if cloud network latency spikes.<br>\n                  \u2022 <strong>Scientific Transparency:</strong> Clearly separates measured optical sensor results from external literature evidence.\n                </div>\n              </div>\n            </div>\n            ", "notes": "Walk the evaluators through the operational flow. Notice how each stage feeds directly into the next, maintaining mathematical and geographic consistency throughout."}, {"id": 17, "title": "Software Engineering & Test Automation", "subtitle": "Comprehensive Automated Test Suites Ensuring Systemic Reliability", "category": "Quality Assurance", "branch": "Test Suite", "content": "\n            <div class=\"two-col\">\n              <div class=\"card\">\n                <h4 style=\"color:#38bdf8; margin:0 0 8px 0;\">Automated Test Modules</h4>\n                <div class=\"metric-card\">\n                  <div class=\"metric-title\">tests/test_state_manager.py</div>\n                  <div class=\"metric-desc\">Tests state initialization, bounding box calculation, location change invalidation, and observation switching.</div>\n                </div>\n                <div class=\"metric-card\">\n                  <div class=\"metric-title\">tests/test_stitching_lab.py</div>\n                  <div class=\"metric-desc\">Validates 4-tile quadrant detection, correspondence data structures, and landmark seam line rendering.</div>\n                </div>\n                <div class=\"metric-card\">\n                  <div class=\"metric-title\">tests/test_historical_sentinel.py & test_temporal_registration.py</div>\n                  <div class=\"metric-desc\">Tests STAC acquisition parsing, chronological sorting, affine alignment, and checkerboard comparison synthesis.</div>\n                </div>\n              </div>\n              <div class=\"card\">\n                <h4 style=\"color:#10b981; margin:0 0 8px 0;\">Engineering Best Practices</h4>\n                <ul class=\"styled-list\" style=\"font-size:0.83rem;\">\n                  <li><strong>Strict Numerical Stability:</strong> Radiometric index assertions verify $\u000barepsilon = 10^{-5}$ denominator protection against zero-division.</li>\n                  <li><strong>Cache Invalidation Rigor:</strong> Switching location guarantees zero stale mosaic leakage across workspaces.</li>\n                  <li><strong>Native Streamlit Layouts:</strong> Uses native <code>st.container</code> and <code>st.html</code> to prevent markdown HTML leaking.</li>\n                </ul>\n              </div>\n            </div>\n            ", "notes": "Academic projects often lack automated tests. TerraPulse v2.0 includes automated test suites covering both the computer vision algorithms and application state management."}, {"id": 18, "title": "Honest Engineering Limitations", "subtitle": "Explicit Design Decisions and Boundary Conditions", "category": "Engineering Integrity", "branch": "Limitations", "content": "\n            <div class=\"table-container\">\n              <table class=\"styled-table\">\n                <thead>\n                  <tr>\n                    <th>Design Boundary</th>\n                    <th>Technical Rationale</th>\n                    <th>Current System State</th>\n                  </tr>\n                </thead>\n                <tbody>\n                  <tr>\n                    <td><strong>LEVIR-CD Dataset Scope</strong></td>\n                    <td>Full 7,120-tile set requires multi-day GPU cluster runs; out of local workstation scope.</td>\n                    <td>Trained rigorously on 832 patches; achieves 0.799 F1.</td>\n                  </tr>\n                  <tr>\n                    <td><strong>Model Studio Visualizations</strong></td>\n                    <td>Live forward hooks on large ViT models consume heavy memory on consumer hardware.</td>\n                    <td>Analytical mathematical feature maps (Difference-of-Gaussians, spatial gradients).</td>\n                  </tr>\n                  <tr>\n                    <td><strong>Temporal Forecasting</strong></td>\n                    <td>Predictive ConvLSTM forecasting requires multi-year dense calibrated image sequences.</td>\n                    <td>Bi-temporal pairwise change detection implemented.</td>\n                  </tr>\n                  <tr>\n                    <td><strong>Radar (SAR) Fusion</strong></td>\n                    <td>Sentinel-1 radar speckle filtering and optical coregistration requires specialized radar toolchains.</td>\n                    <td>Optical Sentinel-2 L2A utilized exclusively.</td>\n                  </tr>\n                  <tr>\n                    <td><strong>Generative World Model</strong></td>\n                    <td>Diffusion-based future Earth simulation is an active research problem.</td>\n                    <td>Architectural roadmap & <code>EarthTilePackage</code> schema preview only.</td>\n                  </tr>\n                </tbody>\n              </table>\n            </div>\n            ", "notes": "Transparency on limitations is considered a hallmark of mature engineering. Documenting what was not done\u2014and why\u2014builds credibility during project defense."}, {"id": 19, "title": "Future Scope & Strategic Roadmap", "subtitle": "Three Horizons of Technical Expansion", "category": "Future Scope", "branch": "Roadmap", "content": "\n            <div class=\"grid-3\">\n              <div class=\"card horizon-card\">\n                <div class=\"horizon-badge\" style=\"background:#0284c7;\">Horizon 1: Near-Term (0\u20136 Mo)</div>\n                <h4 style=\"color:#38bdf8; margin:8px 0 6px 0;\">Scale & Modalities</h4>\n                <ul class=\"styled-list\" style=\"font-size:0.8rem;\">\n                  <li>Train Siamese U-Net on the <strong>full 7,120-tile LEVIR-CD corpus</strong> on an external GPU cluster to target F1 \u2265 0.88.</li>\n                  <li>Integrate <strong>Sentinel-1 SAR C-band radar</strong> for all-weather, day/night cloud-penetrating change detection.</li>\n                  <li>Per-class confusion matrix and ROC curves in the UI.</li>\n                </ul>\n              </div>\n              <div class=\"card horizon-card\">\n                <div class=\"horizon-badge\" style=\"background:#7c3aed;\">Horizon 2: Medium-Term (6\u201318 Mo)</div>\n                <h4 style=\"color:#a855f7; margin:8px 0 6px 0;\">Temporal Modeling</h4>\n                <ul class=\"styled-list\" style=\"font-size:0.8rem;\">\n                  <li>Implement <strong>ConvLSTM / VideoSwin</strong> architecture for continuous deforestation velocity forecasting.</li>\n                  <li>Realize the <code>EarthTilePackage</code> multi-modal schema with temporal embedding layers.</li>\n                  <li>Deploy Google Earth Engine enterprise connector.</li>\n                </ul>\n              </div>\n              <div class=\"card horizon-card\">\n                <div class=\"horizon-badge\" style=\"background:#db2777;\">Horizon 3: Frontier (18+ Mo)</div>\n                <h4 style=\"color:#f472b6; margin:8px 0 6px 0;\">Generative World Models</h4>\n                <ul class=\"styled-list\" style=\"font-size:0.8rem;\">\n                  <li><strong>Conditional Latent Diffusion:</strong> Photorealistic future satellite imagery simulation conditioned on climate scenarios.</li>\n                  <li>Multi-resolution super-resolution combining Sentinel-2 10m with sub-meter imagery (Maxar/Planet).</li>\n                </ul>\n              </div>\n            </div>\n            ", "notes": "Connect the future scope directly to the limitations discussed in Slide 18. Mention that the EarthTilePackage schema is already committed in the codebase as the architectural blueprint for Horizon 2."}, {"id": 20, "title": "Academic References & Technical Q&A", "subtitle": "Literature Citations & Reproducibility Access", "category": "Q&A", "branch": "Repository Access", "content": "\n            <div class=\"two-col\">\n              <div class=\"card\">\n                <h4 style=\"color:#38bdf8; margin:0 0 6px 0;\">Key Academic Citations</h4>\n                <div class=\"ref-item\">\n                  <strong>[1] EuroSAT:</strong> Helber, P. et al. (2019). <em>EuroSAT: A Novel Dataset and Deep Learning Benchmark for LULC.</em> IEEE JSTARS.\n                </div>\n                <div class=\"ref-item\">\n                  <strong>[2] LEVIR-CD:</strong> Chen, H. et al. (2020). <em>Spatial-Temporal Attention Method for Remote Sensing Change Detection.</em> Remote Sensing.\n                </div>\n                <div class=\"ref-item\">\n                  <strong>[3] SIFT:</strong> Lowe, D. G. (2004). <em>Distinctive Image Features from Scale-Invariant Keypoints.</em> IJCV.\n                </div>\n                <div class=\"ref-item\">\n                  <strong>[4] RANSAC:</strong> Fischler, M. A. & Bolles, R. C. (1981). <em>Random Sample Consensus.</em> CACM.\n                </div>\n                <div class=\"ref-item\">\n                  <strong>[5] Prithvi-EO:</strong> Jakubik, J. et al. (2023). <em>Foundation Models for Generalist Geospatial AI.</em> arXiv:2310.18660.\n     let currentIndex = 0;
    let notesOpen = false;

    function renderSlide(index) {
      if (index < 0 || index >= slides.length) return;
      currentIndex = index;
      const slide = slides[index];

      // Update card elements
      document.getElementById('slide-title').innerText = slide.title;
      document.getElementById('slide-subtitle').innerText = slide.subtitle;
      document.getElementById('slide-category').innerText = slide.category;
      
      const branchEl = document.getElementById('slide-branch');
      branchEl.innerText = slide.branch;
      branchEl.className = 'branch-tag ' + (
        slide.branch.includes('main') || slide.branch.includes('v2.0') ? 'branch-main' :
        slide.branch.includes('earthwatch') ? 'branch-earthwatch' :
        slide.branch.includes('osint') ? 'branch-osint' : 'branch-main'
      );

      document.getElementById('slide-content').innerHTML = slide.content;
      document.getElementById('notes-text').innerText = slide.notes;

      // Update counter and progress
      const num = String(index + 1).padStart(2, '0');
      const total = String(slides.length).padStart(2, '0');
      document.getElementById('slide-counter').innerText = `${num} / ${total}`;
      
      const pct = ((index + 1) / slides.length) * 100;
      document.getElementById('progress-bar').style.width = `${pct}%`;

      // Update dropdown
      document.getElementById('slide-select').value = index;

      // Reset scroll on slide change
      document.getElementById('slide-viewport').scrollTop = 0;
    }

    function nextSlide() {
      if (currentIndex < slides.length - 1) {
        renderSlide(currentIndex + 1);
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        renderSlide(currentIndex - 1);
      }
    }

    function jumpToSlide(idx) {
      renderSlide(parseInt(idx, 10));
    }

    function toggleNotes() {
      notesOpen = !notesOpen;
      const drawer = document.getElementById('notes-drawer');
      const btn = document.getElementById('notes-toggle-btn');
      if (notesOpen) {
        drawer.classList.add('open');
        btn.classList.add('btn-active');
      } else {
        drawer.classList.remove('open');
        btn.classList.remove('btn-active');
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.error(`Fullscreen request failed: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Populate dropdown
    const selectEl = document.getElementById('slide-select');
    slides.forEach((s, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.text = `Slide ${String(i+1).padStart(2, '0')}: ${s.title}`;
      selectEl.appendChild(opt);
    });

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'Home') {
        e.preventDefault();
        renderSlide(0);
      } else if (e.key === 'End') {
        e.preventDefault();
        renderSlide(slides.length - 1);
      } else if (e.key === 'n' || e.key === 'N') {
        e.preventDefault();
        toggleNotes();
      } else if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        toggleFullscreen();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        window.print();
      }
    });

    // Initial render
    renderSlide(0);
  </script>
